openapi: 3.0.3

info:
  title: SET Service API
  version: 1.1.0
  description: |
    SET Service REST API for Worker, Company, Super Admin, and restricted Admin roles.

    Core worker flow:
    Worker registers -> verifies OTP -> becomes pending_approval -> super admin or permitted admin approves or rejects -> approved worker can log in and receive tokens.

    Contract-wide observability and authentication rules:
    - Every HTTP response includes `X-Request-ID` and `X-Correlation-ID`.
    - Clients may send either header using 8-128 characters from `[A-Za-z0-9._:-]`; invalid values are replaced server-side.
    - Error bodies include the effective `request_id`; the correlation identifier remains in the response header.
    - `BearerAuth` accepts access tokens only. Refresh tokens are valid only in the documented refresh/logout request bodies.
    - OTP request success means the request was accepted for delivery; it does not prove arrival at the handset or mailbox.
    - Interactive Swagger UI is disabled in production and should be exposed only in controlled non-production environments.

servers:
  - url: http://localhost:3000/v1
    description: Local development
  - url: https://api.setservice.az/v1
    description: Production

security: []

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT access token
      description: Short-lived SET Service JWT access token. Refresh tokens are rejected by authenticated API middleware.

  headers:
    XRequestId:
      description: Effective request identifier used in structured logs and error responses.
      schema: { $ref: '#/components/schemas/RequestId' }
    XCorrelationId:
      description: Correlation identifier propagated across related requests; defaults to the request identifier.
      schema: { $ref: '#/components/schemas/RequestId' }
    RateLimitLimit:
      description: Maximum requests allowed in the current server window.
      schema: { type: integer, minimum: 1 }
    RateLimitRemaining:
      description: Requests remaining in the current server window.
      schema: { type: integer, minimum: 0 }
    RateLimitReset:
      description: Seconds until the current server rate-limit window resets.
      schema: { type: integer, minimum: 0 }
    RetryAfter:
      description: Seconds the client should wait before retrying.
      schema: { type: integer, minimum: 0 }

  responses:
    BadRequest:
      description: Request validation failed.
      headers:
        X-Request-ID: { $ref: '#/components/headers/XRequestId' }
        X-Correlation-ID: { $ref: '#/components/headers/XCorrelationId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Authentication credentials are missing, invalid, expired, revoked, or of the wrong token type.
      headers:
        X-Request-ID: { $ref: '#/components/headers/XRequestId' }
        X-Correlation-ID: { $ref: '#/components/headers/XCorrelationId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: The authenticated account or permission set cannot perform this operation.
      headers:
        X-Request-ID: { $ref: '#/components/headers/XRequestId' }
        X-Correlation-ID: { $ref: '#/components/headers/XCorrelationId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: The resource is absent or intentionally hidden from this caller.
      headers:
        X-Request-ID: { $ref: '#/components/headers/XRequestId' }
        X-Correlation-ID: { $ref: '#/components/headers/XCorrelationId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: The request conflicts with current resource or idempotency state.
      headers:
        X-Request-ID: { $ref: '#/components/headers/XRequestId' }
        X-Correlation-ID: { $ref: '#/components/headers/XCorrelationId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Gone:
      description: The operation or capability is intentionally disabled, expired, or no longer available.
      headers:
        X-Request-ID: { $ref: '#/components/headers/XRequestId' }
        X-Correlation-ID: { $ref: '#/components/headers/XCorrelationId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: A rate limit or OTP abuse-control threshold was exceeded.
      headers:
        X-Request-ID: { $ref: '#/components/headers/XRequestId' }
        X-Correlation-ID: { $ref: '#/components/headers/XCorrelationId' }
        RateLimit-Limit: { $ref: '#/components/headers/RateLimitLimit' }
        RateLimit-Remaining: { $ref: '#/components/headers/RateLimitRemaining' }
        RateLimit-Reset: { $ref: '#/components/headers/RateLimitReset' }
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ServiceUnavailable:
      description: A required dependency, durable queue, scanner, or rate-limit store is unavailable.
      headers:
        X-Request-ID: { $ref: '#/components/headers/XRequestId' }
        X-Correlation-ID: { $ref: '#/components/headers/XCorrelationId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

  schemas:
    RequestId:
      type: string
      minLength: 8
      maxLength: 128
      pattern: '^[A-Za-z0-9._:-]+$'
      example: 7fa22d18-6e54-4c33-8154-9f68f8e2f84b

    Error:
      type: object
      required: [error, code, request_id, timestamp]
      properties:
        error: { type: string, example: Worker is not approved for login. }
        code: { type: string, example: WORKER_NOT_APPROVED }
        details: { type: object, nullable: true, example: { status: pending_approval } }
        request_id: { $ref: '#/components/schemas/RequestId' }
        timestamp: { type: string, format: date-time }

    OtpRequestAcceptedResponse:
      type: object
      required: [otp_sent, retry_after_seconds]
      properties:
        otp_sent:
          type: boolean
          enum: [true]
          description: Generic anti-enumeration acknowledgement that the delivery request was accepted.
        purpose:
          type: string
          nullable: true
          description: OTP purpose when it is safe to return it.
        message:
          type: string
          nullable: true
          description: Generic anti-enumeration message.
        retry_after_seconds: { type: integer, minimum: 1, example: 60 }

    PaginationMeta:
      type: object
      properties:
        page: { type: integer, example: 1 }
        limit: { type: integer, example: 20 }
        total: { type: integer, example: 42 }
        total_pages: { type: integer, example: 3 }

    WorkerStatus:
      type: string
      enum: [draft, pending_otp, pending_approval, approved, rejected, suspended, inactive]
      example: pending_approval

    WorkerClass:
      type: string
      nullable: true
      enum: [A, B, C]
      example: A

    CompanyStatus:
      type: string
      enum: [pending_approval, approved, rejected, suspended, inactive]
      example: approved

    OrderStatus:
      type: string
      description: |
        Order lifecycle. `active` is retained for legacy records. New transitions use
        `published -> partially_assigned -> assigned -> in_progress -> completed`;
        `completed` and `cancelled` are terminal.
      enum: [draft, active, published, partially_assigned, assigned, in_progress, completed, cancelled]
      example: published

    Skill:
      oneOf:
        - type: string
          example: waiter
        - type: object
          properties:
            name: { type: string, example: waiter }
            level: { type: integer, minimum: 1, maximum: 5, example: 4 }

    CompanyDocument:
      type: object
      required: [type, url]
      properties:
        type: { type: string, example: health_certificate }
        url: { type: string, format: uri, example: https://cdn.example.com/documents/passport.pdf }
        name: { type: string, example: Health certificate.pdf }
        mime_type: { type: string, example: application/pdf }
        size_bytes: { type: integer, example: 248000 }
        uploaded_at: { type: string, format: date-time }
        company_visible: { type: boolean, example: true }

    WorkerDocumentMetadata:
      type: object
      description: Safe metadata for a private worker document. Object keys and permanent public URLs are never returned.
      required: [type, company_visible, available, status, scan_status]
      properties:
        type: { type: string, enum: [health_certificate, criminal_record] }
        name: { type: string, example: Health-certificate.pdf }
        mime_type: { type: string, enum: [image/jpeg, image/png, image/webp, application/pdf] }
        size_bytes: { type: integer, minimum: 1, maximum: 5242880 }
        uploaded_at: { type: string, format: date-time }
        company_visible: { type: boolean, example: true }
        status: { type: string, enum: [ready, legacy] }
        scan_status: { type: string, enum: [clean, unscanned] }
        available:
          type: boolean
          description: True only when the private key belongs to this worker and the document is ready with a clean scan result.
        url:
          type: string
          example: /v1/workers/00000000-0000-4000-8000-000000000000/documents/health_certificate/download
          description: Authenticated authorization endpoint; never a permanent object URL.
        download_url:
          type: string
          description: Alias of `url` retained for client compatibility.

    WorkerDocumentDeletionResponse:
      type: object
      required: [status, worker_id, document_type, deleted_at]
      properties:
        status: { type: string, enum: [deleted] }
        worker_id: { type: string, format: uuid }
        document_type: { type: string, enum: [health_certificate, criminal_record] }
        deleted_at: { type: string, format: date-time }

    WorkerAccountDeletionRequest:
      type: object
      required: [confirm]
      additionalProperties: false
      properties:
        confirm:
          type: boolean
          enum: [true]
          description: Explicit confirmation that the authenticated worker wants the account deletion request applied.

    WorkerAccountDeletionResponse:
      type: object
      required: [request_id, worker_id, status, account_state, effective_at]
      properties:
        request_id: { type: string, format: uuid }
        worker_id: { type: string, format: uuid }
        status: { type: string, enum: [accepted] }
        account_state: { type: string, enum: [inactive] }
        effective_at: { type: string, format: date-time }

    WorkExperience:
      type: object
      required: [company_name, position]
      properties:
        company_name: { type: string, example: Marriott Boulevard }
        position: { type: string, example: Ofisiant }
        note: { type: string, example: Banket və VIP qonaq xidməti }

    WorkerRegisterRequest:
      type: object
      required: [full_name, phone, position]
      properties:
        full_name: { type: string, example: Ali Hasanov }
        phone: { type: string, example: "+994501234567" }
        position: { type: string, example: Waiter }
        skills:
          type: array
          items: { $ref: '#/components/schemas/Skill' }
        languages:
          type: array
          items: { type: string }
          example: [az, en]
    CompanyRegisterRequest:
      type: object
      required: [name, contact_name, email, phone]
      properties:
        name: { type: string, example: Grand Hotel Baku }
        contact_name: { type: string, example: Nigar Aliyeva }
        email: { type: string, format: email, example: company@setservice.az }
        phone: { type: string, example: "+994501234568" }
        docs_url: { type: string, format: uri }
        documents:
          type: array
          items: { $ref: '#/components/schemas/CompanyDocument' }

    RequestOtpRequest:
      type: object
      required: [phone]
      properties:
        phone: { type: string, example: "+994501234567" }
        purpose:
          type: string
          enum: [worker_registration, worker_password_reset]
          example: worker_registration

    WorkerLoginRequest:
      type: object
      required: [phone, password]
      properties:
        phone: { type: string, example: "+994501234567" }
        password: { type: string, minLength: 8, example: Worker123! }

    EmailPasswordLoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, example: admin@setservice.az }
        password: { type: string, minLength: 8, example: <explicit-admin-password> }

    CompleteWorkerRegistrationRequest:
      type: object
      required: [phone, password]
      description: Provide either otp_code for legacy direct completion or otp_challenge returned by /auth/verify-otp.
      properties:
        phone: { type: string, example: "+994501234567" }
        otp_code:
          type: string
          example: "123456"
          description: Development only when OTP_TEST_MODE=true.
        otp_challenge:
          type: string
          description: Short-lived challenge returned after server-side OTP verification.
        password: { type: string, minLength: 8, example: Worker123! }

    CompleteCompanyRegistrationRequest:
      type: object
      required: [email, password]
      description: Provide either otp_code for legacy direct completion or otp_challenge returned by /auth/verify-otp.
      properties:
        email: { type: string, format: email, example: company@setservice.az }
        otp_code:
          type: string
          example: "123456"
          description: Development only when OTP_TEST_MODE=true.
        otp_challenge:
          type: string
          description: Short-lived challenge returned after server-side OTP verification.
        password: { type: string, minLength: 8, example: <explicit-company-password> }

    WorkerForgotPasswordRequest:
      type: object
      properties:
        method: { type: string, enum: [phone, email], example: phone }
        phone: { type: string, example: "+994501234567" }
        email: { type: string, format: email, example: worker@setservice.az }
      description: Provide either phone or email. The API returns a generic response and does not reveal account existence.

    WorkerResetPasswordRequest:
      type: object
      required: [password]
      description: Provide phone or email plus either otp_code for legacy direct reset or otp_challenge returned by /auth/verify-otp.
      properties:
        method: { type: string, enum: [phone, email], example: phone }
        phone: { type: string, example: "+994501234567" }
        email: { type: string, format: email, example: worker@setservice.az }
        otp_code: { type: string, example: "123456" }
        otp_challenge:
          type: string
          description: Short-lived challenge returned after server-side OTP verification.
        password: { type: string, minLength: 8, example: Worker123! }

    WorkerPhoneChangeRequest:
      type: object
      required: [phone]
      properties:
        phone: { type: string, example: "+994501234569" }

    WorkerPhoneChangeConfirmRequest:
      type: object
      required: [phone, otp_code]
      properties:
        phone: { type: string, example: "+994501234569" }
        otp_code: { type: string, example: "123456" }

    EmailVerificationRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email, example: worker@setservice.az }

    EmailVerificationConfirmRequest:
      type: object
      required: [otp_code]
      properties:
        otp_code: { type: string, example: "123456" }

    CompanyForgotPasswordRequest:
      type: object
      properties:
        method: { type: string, enum: [phone, email], example: email }
        phone: { type: string, example: "+994501234567" }
        email: { type: string, format: email, example: company@setservice.az }

    CompanyResetPasswordRequest:
      type: object
      required: [password]
      description: Provide phone or email plus either otp_code for legacy direct reset or otp_challenge returned by /auth/verify-otp.
      properties:
        method: { type: string, enum: [phone, email], example: email }
        phone: { type: string, example: "+994501234567" }
        email: { type: string, format: email, example: company@setservice.az }
        otp_code: { type: string, example: "123456" }
        otp_challenge:
          type: string
          description: Short-lived challenge returned after server-side OTP verification.
        password: { type: string, minLength: 8, example: <explicit-company-password> }

    AdminForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email, example: admin@setservice.az }

    VerifyOtpRequest:
      type: object
      required: [otp_code]
      description: Provide either phone or email. Successful registration/reset verification returns otp_challenge for the next password step.
      properties:
        method: { type: string, enum: [phone, email], example: phone }
        phone: { type: string, example: "+994501234567" }
        email: { type: string, format: email, example: worker@setservice.az }
        otp_code:
          type: string
          example: "123456"
          description: Development only when OTP_TEST_MODE=true.
        purpose:
          type: string
          enum: [worker_registration, worker_password_reset, worker_phone_change, company_registration, company_password_reset, worker_login, company_login, admin_login]
          example: worker_registration
          description: Login OTP purposes are deprecated and return OTP_LOGIN_DEPRECATED.

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: { type: string }

    LogoutRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: { type: string }

    FcmTokenRequest:
      type: object
      required: [fcm_token]
      properties:
        fcm_token:
          type: string
          minLength: 10
          maxLength: 4096
          example: "fcm_registration_token_from_device"
        platform:
          type: string
          enum: [android, ios, web, unknown]
          default: unknown
          example: android
        device_id:
          type: string
          maxLength: 160
          example: "android-device-installation-id"

    FcmTokenResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        platform: { type: string, example: android }
        app_role: { type: string, enum: [worker, company, super_admin, admin] }
        registered: { type: boolean, example: true }
        last_seen_at: { type: string, format: date-time }

    TokenResponse:
      type: object
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        user:
          type: object
          properties:
            id: { type: string, format: uuid }
            phone: { type: string }
            email: { type: string, format: email, nullable: true }
            role: { type: string, enum: [super_admin, admin, company, worker] }
            name: { type: string }
            permissions:
              type: array
              items: { $ref: '#/components/schemas/AdminPermission' }
            worker:
              type: object
              nullable: true
              properties:
                id: { type: string, format: uuid }
                status: { $ref: '#/components/schemas/WorkerStatus' }
            company:
              type: object
              nullable: true
              properties:
                id: { type: string, format: uuid }
                status: { $ref: '#/components/schemas/CompanyStatus' }

    WebSessionResponse:
      type: object
      required: [access_token, user]
      description: |
        Browser-session response. The rotating refresh token is never exposed to JavaScript;
        it is delivered only through a role-scoped HttpOnly cookie.
      properties:
        access_token:
          type: string
          description: Short-lived bearer access token. Keep it in memory only.
        user:
          type: object
          required: [id, role]
          properties:
            id: { type: string, format: uuid }
            phone: { type: string, nullable: true }
            email: { type: string, format: email, nullable: true }
            role: { type: string, enum: [super_admin, admin, company] }
            name: { type: string }
            permissions:
              type: array
              items: { $ref: '#/components/schemas/AdminPermission' }
            company:
              type: object
              nullable: true
              properties:
                id: { type: string, format: uuid }
                status: { $ref: '#/components/schemas/CompanyStatus' }

    AdminPermission:
      type: string
      description: Manage permissions are normalized with required view permissions. `manage_workers` implies `view_workers`; `manage_companies` implies `view_companies`; `manage_assignments` implies `view_assignments`, `view_orders`, and `view_workers`; `manage_kiosks` implies `view_orders` and `view_assignments`.
      enum:
        - view_dashboard
        - view_workers
        - manage_workers
        - view_companies
        - manage_companies
        - view_orders
        - view_assignments
        - manage_assignments
        - view_attendance
        - view_reports
        - manage_kiosks
        - view_notifications
        - manage_admins

    ManagedAdmin:
      type: object
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        name: { type: string, example: Operations Admin }
        email: { type: string, format: email, example: ops@setservice.az }
        role: { type: string, enum: [admin] }
        is_active: { type: boolean, example: true }
        permissions:
          type: array
          items: { $ref: '#/components/schemas/AdminPermission' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CreateAdminRequest:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string, example: Operations Admin }
        email: { type: string, format: email, example: ops@setservice.az }
        password: { type: string, minLength: 8, example: <explicit-admin-password> }
        is_active: { type: boolean, default: true }
        permissions:
          type: array
          items: { $ref: '#/components/schemas/AdminPermission' }

    UpdateAdminRequest:
      type: object
      properties:
        name: { type: string, example: Operations Admin }
        email: { type: string, format: email, example: ops@setservice.az }
        password: { type: string, minLength: 8, example: <explicit-admin-password> }
        is_active: { type: boolean }
        permissions:
          type: array
          items: { $ref: '#/components/schemas/AdminPermission' }

    WorkerProfile:
      type: object
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        name: { type: string }
        phone: { type: string }
        email: { type: string, format: email, nullable: true, description: Visible to worker and admin only; omitted from company-safe profile. }
        position: { type: string }
        profile_photo_url: { type: string, nullable: true }
        skills:
          type: array
          items: { $ref: '#/components/schemas/Skill' }
        languages:
          type: array
          items: { type: string }
        documents:
          type: array
          items: { $ref: '#/components/schemas/WorkerDocumentMetadata' }
        work_history_summary: { type: string, nullable: true }
        work_history:
          type: array
          items: { $ref: '#/components/schemas/WorkExperience' }
        gender:
          type: string
          nullable: true
          enum: [male, female]
        whatsapp_available: { type: boolean, example: true }
        status: { $ref: '#/components/schemas/WorkerStatus' }
        reject_reason: { type: string, nullable: true }
        availability: { type: boolean }
        worker_class: { $ref: '#/components/schemas/WorkerClass' }
        is_foc_training:
          type: boolean
          example: false
          description: Admin-only flag. Not exposed in company-safe worker profile responses.
        foc_training_note: { type: string, nullable: true }
        foc_training_updated_at: { type: string, format: date-time, nullable: true }
        foc_training_updated_by_id: { type: string, format: uuid, nullable: true }
        rating_avg: { type: number, example: 4.5 }
        rating_count: { type: integer, example: 12 }
        rating_summary:
          type: object
          properties:
            average: { type: number, example: 4.5 }
            count: { type: integer, example: 12 }
        created_at: { type: string, format: date-time }

    CompanyVisibleWorkerProfile:
      type: object
      description: Worker profile visible to a company. Private contact fields such as phone/email are intentionally omitted.
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        position: { type: string, nullable: true }
        profile_photo_url: { type: string, nullable: true }
        skills:
          type: array
          items: { $ref: '#/components/schemas/Skill' }
        languages:
          type: array
          items: { type: string }
        documents:
          type: array
          description: Only company-visible documents are returned.
          items: { $ref: '#/components/schemas/WorkerDocumentMetadata' }
        work_history_summary: { type: string, nullable: true }
        work_history:
          type: array
          items: { $ref: '#/components/schemas/WorkExperience' }
        rating_avg: { type: number, example: 4.5 }
        rating_count: { type: integer, example: 12 }

    Rating:
      type: object
      properties:
        id: { type: string, format: uuid }
        assignment_id: { type: string, format: uuid, nullable: true }
        order_id: { type: string, format: uuid }
        worker_id: { type: string, format: uuid }
        rater_id: { type: string, format: uuid }
        score: { type: integer, minimum: 1, maximum: 5, example: 5 }
        feedback: { type: string, nullable: true, example: Excellent service and punctuality. }
        comment: { type: string, nullable: true, deprecated: true }
        created_at: { type: string, format: date-time }
        order:
          type: object
          properties:
            id: { type: string, format: uuid }
            title: { type: string, example: Banquet service }
            company:
              type: object
              properties:
                id: { type: string, format: uuid }
                name: { type: string, example: Grand Hotel Baku }

    RatingSummary:
      type: object
      properties:
        rating_avg: { type: number, example: 4.8 }
        rating_count: { type: integer, example: 9 }
        data:
          type: array
          items: { $ref: '#/components/schemas/Rating' }

    CreateRatingRequest:
      description: |
        Primary mode is `assignment_id + score + optional feedback`.
        Legacy/alternative mode `order_id + worker_id + score + optional feedback` remains supported for compatibility.
      oneOf:
        - type: object
          required: [assignment_id, score]
          properties:
            assignment_id: { type: string, format: uuid, example: "{{assignment_id}}" }
            score: { type: integer, minimum: 1, maximum: 5, example: 5 }
            feedback: { type: string, maxLength: 1000, example: İşçi vaxtında gəldi və növbəni uğurla tamamladı. }
        - type: object
          required: [order_id, worker_id, score]
          properties:
            order_id: { type: string, format: uuid, example: "{{order_id}}" }
            worker_id: { type: string, format: uuid, example: "{{worker_id_1}}" }
            score: { type: integer, minimum: 1, maximum: 5, example: 5 }
            feedback: { type: string, maxLength: 1000, example: İşçi növbəni vaxtında və keyfiyyətlə tamamladı. }

    CompanyProfile:
      type: object
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        name: { type: string }
        contact_name: { type: string }
        phone: { type: string }
        email: { type: string, format: email, nullable: true }
        status: { $ref: '#/components/schemas/CompanyStatus' }
        docs_url: { type: string, nullable: true }
        reject_reason: { type: string, nullable: true }
        created_at: { type: string, format: date-time }

    RejectRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 3, example: Documents are incomplete. }

    Notification:
      type: object
      properties:
        id: { type: string, format: uuid }
        type:
          type: string
          enum: [worker_approved, worker_rejected, company_approved, company_rejected, order_created, job_assigned, system]
        channel:
          type: string
          enum: [in_app, sms, email, push]
        title: { type: string }
        body: { type: string }
        metadata: { type: object }
        read_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    NotificationListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Notification' }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    TaxonomySummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        slug: { type: string, example: waiter-waitress }
        name_az: { type: string, example: Waiter/Waitress }
        name_en: { type: string, nullable: true, example: Waiter/Waitress }
        status: { type: string, enum: [active, inactive] }

    TaxonomyPosition:
      allOf:
        - $ref: '#/components/schemas/TaxonomySummary'
        - type: object
          properties:
            subdepartment_id: { type: string, format: uuid }
            department_id: { type: string, format: uuid }
            department: { $ref: '#/components/schemas/TaxonomySummary' }
            subdepartment: { $ref: '#/components/schemas/TaxonomySummary' }

    TaxonomySubdepartment:
      allOf:
        - $ref: '#/components/schemas/TaxonomySummary'
        - type: object
          properties:
            department_id: { type: string, format: uuid }
            positions:
              type: array
              items: { $ref: '#/components/schemas/TaxonomyPosition' }

    TaxonomyDepartment:
      allOf:
        - $ref: '#/components/schemas/TaxonomySummary'
        - type: object
          properties:
            subdepartments:
              type: array
              items: { $ref: '#/components/schemas/TaxonomySubdepartment' }

    OrderCategoryItem:
      type: object
      properties:
        id: { type: string, format: uuid, nullable: true }
        category: { type: string, example: waiter }
        department_id: { type: string, format: uuid, nullable: true }
        subdepartment_id: { type: string, format: uuid, nullable: true }
        position_id: { type: string, format: uuid, nullable: true }
        department: { $ref: '#/components/schemas/TaxonomySummary', nullable: true }
        subdepartment: { $ref: '#/components/schemas/TaxonomySummary', nullable: true }
        position: { $ref: '#/components/schemas/TaxonomyPosition', nullable: true }
        required_count: { type: integer, minimum: 1, example: 3 }
        assigned_count: { type: integer, minimum: 0, example: 1 }
        remaining_count: { type: integer, minimum: 0, example: 2 }
        notes: { type: string, nullable: true, example: White shirt uniform required. }

    CreateOrderCategoryItem:
      type: object
      required: [required_count]
      properties:
        category: { type: string, minLength: 2, maxLength: 100, example: Waiter/Waitress, description: Legacy/display label. Backend derives it from position_id when omitted. }
        department_id: { type: string, format: uuid }
        subdepartment_id: { type: string, format: uuid }
        position_id: { type: string, format: uuid, description: Preferred selector field. Required unless sending a legacy category. }
        required_count: { type: integer, minimum: 1, maximum: 500, example: 3 }
        notes: { type: string, maxLength: 500, example: White shirt uniform required. }

    Order:
      type: object
      required:
        - id
        - company_id
        - title
        - description
        - required_count
        - start_datetime
        - end_datetime
        - location
        - status
        - version
        - created_at
        - updated_at
      properties:
        id: { type: string, format: uuid }
        company_id: { type: string, format: uuid }
        company:
          type: object
          properties:
            id: { type: string, format: uuid }
            name: { type: string, example: Grand Hotel Baku }
            status: { $ref: '#/components/schemas/CompanyStatus' }
            contact_name: { type: string, example: Nigar Aliyeva }
            phone: { type: string, example: "+994501234568" }
        title: { type: string, example: Banquet service shift }
        description: { type: string, example: Waiter and kitchen support for an evening hotel banquet. }
        category: { type: string, example: hospitality }
        required_count: { type: integer, minimum: 1, example: 4 }
        category_items:
          type: array
          description: Category-aware staffing requirements. Legacy single-category orders return one item.
          items: { $ref: '#/components/schemas/OrderCategoryItem' }
        required_skills:
          type: array
          items: { type: string }
          example: [waiter, chef]
        start_datetime: { type: string, format: date-time, example: "2030-01-15T10:00:00.000Z" }
        end_datetime: { type: string, format: date-time, example: "2030-01-15T18:00:00.000Z" }
        location: { type: string, example: Grand Hotel Baku, Baku }
        pay_rate: { type: number, nullable: true, example: 18.5 }
        notes: { type: string, nullable: true, example: Formal dress required. }
        status: { $ref: '#/components/schemas/OrderStatus' }
        version:
          type: integer
          minimum: 1
          description: Monotonic optimistic-concurrency version. Send it as `expected_version` for cancellation.
          example: 1
        assignment_count: { type: integer, example: 0 }
        rating_count: { type: integer, example: 0 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    OrderListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Order' }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    UpdateWorkerFocTrainingRequest:
      type: object
      required: [worker_ids, is_foc_training]
      properties:
        worker_ids:
          type: array
          minItems: 1
          maxItems: 200
          items: { type: string, format: uuid }
        is_foc_training:
          type: boolean
          description: true adds selected workers to F.O.C. training; false removes them.
        note:
          type: string
          nullable: true
          maxLength: 1000
          example: Training cost covered by SET Service.

    CreateOrderRequest:
      type: object
      required: [title, description, start_datetime, end_datetime, location]
      description: |
        Preferred mode is category_items for multi-category orders. Legacy clients may still send category + required_count.
      properties:
        title: { type: string, minLength: 3, maxLength: 160, example: Banquet service shift }
        description: { type: string, minLength: 10, maxLength: 5000, example: Waiter and kitchen support for an evening hotel banquet. }
        category:
          type: string
          minLength: 2
          maxLength: 100
          example: hospitality
          description: Legacy single-category field. Use category_items for new clients.
        required_count:
          type: integer
          minimum: 1
          maximum: 500
          example: 6
          description: Legacy total required count. With category_items the backend stores the sum.
        category_items:
          type: array
          minItems: 1
          maxItems: 25
          items: { $ref: '#/components/schemas/CreateOrderCategoryItem' }
          example:
            - { category: waiter, required_count: 3, notes: White shirt uniform required. }
            - { category: bartender, required_count: 2 }
            - { category: dishwasher, required_count: 1 }
        start_datetime:
          type: string
          format: date-time
          description: Must be in the future.
          example: "2030-01-15T10:00:00.000Z"
        end_datetime:
          type: string
          format: date-time
          description: Must be after start_datetime.
          example: "2030-01-15T18:00:00.000Z"
        location: { type: string, minLength: 2, maxLength: 250, example: Grand Hotel Baku, Baku }
        pay_rate: { type: number, minimum: 0.01, example: 18.5 }
        required_skills:
          type: array
          maxItems: 50
          items: { type: string }
          example: [waiter, chef]
        notes: { type: string, maxLength: 2000, example: Formal dress required. }

    CancelOrderRequest:
      type: object
      additionalProperties: false
      properties:
        reason: { type: string, maxLength: 500, example: Client cancelled the event. }
        expected_version:
          type: integer
          minimum: 1
          description: |
            Optional for legacy clients but strongly recommended. A stale value returns
            `409 ORDER_VERSION_CONFLICT` without applying cancellation side effects.
          example: 3

    AssignmentStatus:
      type: string
      enum: [assigned, accepted, rejected, completed, cancelled]
      example: assigned

    Assignment:
      type: object
      properties:
        id: { type: string, format: uuid }
        order_id: { type: string, format: uuid }
        worker_id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/AssignmentStatus' }
        order_category_item_id: { type: string, format: uuid, nullable: true }
        category: { type: string, nullable: true, example: waiter }
        category_item:
          allOf:
            - $ref: '#/components/schemas/OrderCategoryItem'
          nullable: true
        assigned_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        order:
          type: object
          properties:
            id: { type: string, format: uuid }
            title: { type: string, example: Banquet service shift }
            category: { type: string, example: hospitality }
            status: { $ref: '#/components/schemas/OrderStatus' }
            required_count: { type: integer, example: 4 }
            category_items:
              type: array
              items: { $ref: '#/components/schemas/OrderCategoryItem' }
            start_datetime: { type: string, format: date-time, example: "2030-01-15T10:00:00.000Z" }
            end_datetime: { type: string, format: date-time, example: "2030-01-15T18:00:00.000Z" }
            location: { type: string, example: Grand Hotel Baku, Baku }
        worker:
          type: object
          properties:
            id: { type: string, format: uuid }
            name: { type: string, example: Ali Hasanov }
            phone: { type: string, example: "+994501234567" }
            status: { $ref: '#/components/schemas/WorkerStatus' }
            availability: { type: boolean, example: true }
            position: { type: string, example: Waiter }

    CreateAssignmentsRequest:
      type: object
      required: [order_id]
      description: |
        Legacy mode: worker_ids plus optional category or order_category_item_id.
        Preferred mode: assignments array, where each worker can target a category item.
      properties:
        order_id: { type: string, format: uuid }
        worker_ids:
          type: array
          minItems: 1
          maxItems: 100
          items: { type: string, format: uuid }
        category: { type: string, example: waiter }
        order_category_item_id: { type: string, format: uuid, example: "{{order_category_item_id}}" }
        assignments:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            required: [worker_id]
            properties:
              worker_id: { type: string, format: uuid, example: "{{worker_id_1}}" }
              category: { type: string, example: waiter }
              order_category_item_id: { type: string, format: uuid, example: "{{order_category_item_id}}" }

    CancelAssignmentRequest:
      type: object
      properties:
        reason: { type: string, minLength: 3, maxLength: 500, example: Worker is no longer needed. }

    Location:
      type: object
      properties:
        latitude: { type: number, example: 40.4093 }
        longitude: { type: number, example: 49.8671 }
        address: { type: string, example: Grand Hotel Baku entrance }

    GenerateAttendanceQrRequest:
      type: object
      required: [assignment_id]
      properties:
        assignment_id: { type: string, format: uuid, example: "{{assignment_id}}" }
        ttl_seconds:
          type: integer
          minimum: 30
          maximum: 300
          example: 60
          description: Optional short TTL for dynamic QR display. The display should refresh every 30 seconds.

    CreateKioskSessionRequest:
      type: object
      required: [assignment_id]
      properties:
        assignment_id: { type: string, format: uuid, example: "{{assignment_id}}" }
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: Optional kiosk display expiry. Defaults to server KIOSK_SESSION_TTL_HOURS.

    CreateVenueKioskRequest:
      type: object
      required: [name]
      properties:
        company_id: { type: string, format: uuid, example: "{{company_id}}" }
        name: { type: string, example: "Hilton əsas giriş" }
        location_label: { type: string, nullable: true, example: "Lobby / əsas giriş" }

    ActivateVenueKioskRequest:
      type: object
      required: [order_id]
      properties:
        order_id: { type: string, format: uuid, example: "{{order_id}}" }
        expires_at: { type: string, format: date-time, nullable: true }

    VenueKioskActiveSession:
      type: object
      properties:
        id: { type: string, format: uuid, example: "{{venue_kiosk_session_id}}" }
        order_id: { type: string, format: uuid, example: "{{order_id}}" }
        order_title: { type: string, example: "Hilton Baku banket xidməti" }
        company_id: { type: string, format: uuid, example: "{{company_id}}" }
        status: { type: string, enum: [active, inactive, revoked], example: active }
        activated_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time, nullable: true }
        location: { type: string, nullable: true, example: "Hilton Baku, Bakı" }
        shift_start: { type: string, format: date-time, nullable: true }
        shift_end: { type: string, format: date-time, nullable: true }

    VenueKioskPublicContext:
      type: object
      properties:
        id: { type: string, format: uuid, example: "{{venue_kiosk_id}}" }
        kiosk_id: { type: string, format: uuid, example: "{{venue_kiosk_id}}" }
        company_id: { type: string, format: uuid, example: "{{company_id}}" }
        company_name: { type: string, example: "Hilton Baku" }
        name: { type: string, example: "Hilton əsas giriş" }
        kiosk_name: { type: string, example: "Hilton əsas giriş" }
        location_label: { type: string, nullable: true, example: "Lobby / əsas giriş" }
        status: { type: string, enum: [active, disabled], example: active }
        kiosk_status: { type: string, enum: [active, disabled], example: active }
        refresh_interval_seconds: { type: integer, example: 30 }
        active_session:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/VenueKioskActiveSession'

    VenueKiosk:
      allOf:
        - $ref: '#/components/schemas/VenueKioskPublicContext'
        - type: object
          properties:
            kiosk_url:
              type: string
              description: Authenticated management link. The capability is carried only in the URL fragment.
              example: "/kiosk#capability={{venue_kiosk_token}}"

    VenueKioskCreateResponse:
      allOf:
        - $ref: '#/components/schemas/VenueKiosk'
        - type: object
          properties:
            kiosk_token:
              type: string
              description: Raw persistent venue kiosk token. Returned on creation.
              example: "{{venue_kiosk_token}}"

    KioskSession:
      type: object
      properties:
        id: { type: string, format: uuid, example: "{{kiosk_session_id}}" }
        assignment_id: { type: string, format: uuid, example: "{{assignment_id}}" }
        order_id: { type: string, format: uuid, example: "{{order_id}}" }
        order_title: { type: string, example: Hilton Baku banket xidmeti }
        company_id: { type: string, format: uuid, example: "{{company_id}}" }
        company_name: { type: string, example: Hilton Baku }
        location: { type: string, example: Hilton Baku, Baki }
        shift_start: { type: string, format: date-time }
        shift_end: { type: string, format: date-time }
        category: { type: string, nullable: true, example: Ofisiant }
        status: { type: string, enum: [active, inactive], example: active }
        kiosk_status: { type: string, enum: [active, inactive], example: active }
        expires_at: { type: string, format: date-time, nullable: true }
        revoked_at: { type: string, format: date-time, nullable: true }
        refresh_interval_seconds: { type: integer, example: 30 }

    KioskSessionCreateResponse:
      allOf:
        - $ref: '#/components/schemas/KioskSession'
        - type: object
          properties:
            kiosk_token:
              type: string
              description: Raw kiosk display token. Returned only once on creation.
              example: "{{kiosk_token}}"
            kiosk_url:
              type: string
              description: The capability is carried only in the URL fragment and is removed from the address bar by the kiosk client after bootstrap.
              example: "/kiosk#capability={{kiosk_token}}"

    KioskQrTokenResponse:
      allOf:
        - $ref: '#/components/schemas/KioskSession'
        - type: object
          properties:
            token: { type: string, example: "{{attendance_qr_token}}" }
            expires_at: { type: string, format: date-time }
            refresh_after_seconds: { type: integer, example: 30 }
            kiosk_expires_at: { type: string, format: date-time, nullable: true }

    AttendanceCheckInRequest:
      type: object
      required: [qr_token]
      properties:
        assignment_id:
          type: string
          format: uuid
          nullable: true
          description: Optional for order-based venue kiosk QR. Required for legacy assignment-specific QR.
          example: "{{assignment_id}}"
        qr_token: { type: string, example: "{{attendance_qr_token}}" }
        location: { $ref: '#/components/schemas/Location' }
        notes: { type: string, example: Arrived on time. }

    AttendanceCheckOutRequest:
      type: object
      required: [qr_token]
      properties:
        assignment_id:
          type: string
          format: uuid
          nullable: true
          description: Optional for order-based venue kiosk QR. Required for legacy assignment-specific QR.
          example: "{{assignment_id}}"
        qr_token: { type: string, example: "{{attendance_qr_token}}" }
        location: { $ref: '#/components/schemas/Location' }
        notes: { type: string, example: Shift completed. }

    AttendanceLog:
      type: object
      properties:
        id: { type: string, format: uuid }
        assignment_id: { type: string, format: uuid }
        checkin_time: { type: string, format: date-time, nullable: true }
        checkout_time: { type: string, format: date-time, nullable: true }
        duration_minutes: { type: integer, nullable: true, example: 480 }
        checkin_location: { $ref: '#/components/schemas/Location' }
        checkout_location: { $ref: '#/components/schemas/Location' }
        checkin_notes: { type: string, nullable: true }
        checkout_notes: { type: string, nullable: true }
        assignment:
          type: object
          properties:
            id: { type: string, format: uuid }
            status: { $ref: '#/components/schemas/AssignmentStatus' }
            worker:
              type: object
              properties:
                id: { type: string, format: uuid }
                name: { type: string, example: Ali Hasanov }
                phone:
                  type: string
                  example: "+994501234567"
                  description: Returned to super admin/worker only. Omitted from company responses.
            order:
              type: object
              properties:
                id: { type: string, format: uuid }
                title: { type: string, example: Banquet service shift }
                status: { $ref: '#/components/schemas/OrderStatus' }
                company:
                  type: object
                  properties:
                    id: { type: string, format: uuid }
                    name: { type: string, example: Grand Hotel Baku }

    AttendanceListResponse:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/AttendanceLog' }
        meta:
          $ref: '#/components/schemas/PaginationMeta'

paths:
  /health:
    get:
      tags: [Operations]
      summary: Process liveness probe
      description: Confirms that the HTTP process is running. It does not check dependencies.
      servers:
        - url: http://localhost:3000
        - url: https://api.setservice.az
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema:
                type: object
                required: [status, timestamp]
                properties:
                  status: { type: string, enum: [ok] }
                  timestamp: { type: string, format: date-time }

  /ready:
    get:
      tags: [Operations]
      summary: Dependency readiness probe
      description: Returns 200 only when PostgreSQL, configured Redis, and the in-process or separately deployed outbox worker heartbeat are ready.
      servers:
        - url: http://localhost:3000
        - url: https://api.setservice.az
      responses:
        '200': { description: All required dependencies are ready }
        '503': { description: At least one required dependency is unavailable }

  /auth/register:
    post:
      tags: [Auth]
      summary: Compatibility registration endpoint for worker or company
      description: Prefer /auth/worker/register and /auth/company/register for new clients.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - allOf:
                    - $ref: '#/components/schemas/WorkerRegisterRequest'
                    - type: object
                      required: [role]
                      properties:
                        role: { type: string, enum: [worker] }
                - allOf:
                    - $ref: '#/components/schemas/CompanyRegisterRequest'
                    - type: object
                      required: [role]
                      properties:
                        role: { type: string, enum: [company] }
      responses:
        '201': { description: Account created and OTP sent }

  /auth/worker/register:
    post:
      tags: [Auth]
      summary: Register worker and send registration OTP
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkerRegisterRequest' }
      responses:
        '201': { description: Worker created with pending_otp status }
        '409':
          description: Phone already registered
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /auth/worker/request-otp:
    post:
      tags: [Auth]
      summary: Request worker OTP for registration resend or password reset
      description: |
        Returns a generic anti-enumeration acknowledgement after the OTP has been accepted into the
        durable delivery flow. A successful HTTP response does not guarantee SMS delivery.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RequestOtpRequest' }
      responses:
        '200':
          description: OTP delivery request accepted or a generic anti-enumeration response returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OtpRequestAcceptedResponse' }
        '403':
          description: Worker is not approved or registration is not pending OTP
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /auth/worker/login:
    post:
      tags: [Auth]
      summary: Approved worker login with phone and password
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkerLoginRequest' }
      responses:
        '200':
          description: JWT token pair
          content: { application/json: { schema: { $ref: '#/components/schemas/TokenResponse' } } }
        '403':
          description: Worker is pending_approval, rejected, suspended, inactive, or unknown
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /auth/worker/complete-registration:
    post:
      tags: [Auth]
      summary: Verify worker registration OTP and create password
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompleteWorkerRegistrationRequest' }
      responses:
        '200': { description: Password set and worker moved to pending_approval }
        '401': { description: Invalid or expired OTP }

  /auth/worker/forgot-password:
    post:
      tags: [Auth]
      summary: Request worker password reset OTP
      description: |
        Always returns an anti-enumeration response. For an eligible account, delivery is queued
        asynchronously through the configured SMS or email provider.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkerForgotPasswordRequest' }
      responses:
        '200':
          description: Generic OTP delivery acknowledgement
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OtpRequestAcceptedResponse' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /auth/worker/reset-password:
    post:
      tags: [Auth]
      summary: Verify worker password reset OTP and set a new password
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkerResetPasswordRequest' }
      responses:
        '200': { description: Password reset }
        '401': { description: Invalid or expired OTP }

  /auth/worker/phone-change/request:
    post:
      tags: [Auth]
      security: [{ BearerAuth: [] }]
      summary: Request OTP for worker phone number change
      description: |
        The authenticated worker phone identity is not changed until OTP confirmation succeeds.
        Success means the OTP delivery was queued; it does not prove handset delivery.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkerPhoneChangeRequest' }
      responses:
        '200': { description: OTP sent to the new phone number }
        '409': { description: Phone number is already registered }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /auth/worker/phone-change/confirm:
    post:
      tags: [Auth]
      security: [{ BearerAuth: [] }]
      summary: Confirm worker phone number change with OTP
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkerPhoneChangeConfirmRequest' }
      responses:
        '200': { description: Worker phone identity updated }
        '401': { description: Invalid or expired OTP }

  /auth/email-verification/request:
    post:
      tags: [Auth]
      security: [{ BearerAuth: [] }]
      summary: Request email verification code for the authenticated user
      description: |
        The new email is stored as pending_email until code confirmation succeeds.
        Success means delivery was queued; it does not prove mailbox delivery.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailVerificationRequest' }
      responses:
        '200': { description: Email verification code sent or email already verified }
        '409': { description: Email is already registered }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /auth/email-verification/confirm:
    post:
      tags: [Auth]
      security: [{ BearerAuth: [] }]
      summary: Confirm pending email with verification code
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailVerificationConfirmRequest' }
      responses:
        '200': { description: Pending email promoted to verified email }
        '401': { description: Invalid or expired email verification code }

  /auth/company/register:
    post:
      tags: [Auth]
      summary: Register company and send OTP
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompanyRegisterRequest' }
      responses:
        '201': { description: Company created with pending_approval status }

  /auth/company/login:
    post:
      tags: [Auth]
      summary: Approved company login with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/EmailPasswordLoginRequest'
              example:
                email: company@setservice.az
                password: <explicit-company-password>
      responses:
        '200':
          description: JWT token pair
          content: { application/json: { schema: { $ref: '#/components/schemas/TokenResponse' } } }
        '403': { description: Company is not approved }

  /auth/company/web-login:
    post:
      tags: [Auth]
      security: []
      summary: Approved company browser login
      description: |
        Requires an exact trusted Origin. Returns the short-lived access token in the response
        and sets the rotating company refresh token in a role-scoped HttpOnly cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailPasswordLoginRequest' }
      responses:
        '200':
          description: Browser session started
          headers:
            Set-Cookie:
              description: Role-scoped HttpOnly refresh cookie; Secure is mandatory for SameSite=None.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebSessionResponse' }
        '403': { description: Origin is not trusted or company is not approved }

  /auth/company/web-refresh:
    post:
      tags: [Auth]
      security: []
      summary: Rotate the company browser refresh cookie
      description: |
        Requires an exact trusted Origin and the company HttpOnly refresh cookie.
        The previous refresh token is revoked during rotation and is never returned in JSON.
      responses:
        '200':
          description: Browser session rotated
          headers:
            Set-Cookie:
              description: Newly rotated role-scoped HttpOnly refresh cookie.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebSessionResponse' }
        '401': { description: Browser session is missing, expired, or revoked }
        '403': { description: Origin is not trusted }

  /auth/company/web-logout:
    post:
      tags: [Auth]
      security: []
      summary: Revoke and clear the company browser session
      description: Requires an exact trusted Origin and revokes the refresh token from the HttpOnly cookie.
      responses:
        '204':
          description: Browser session revoked
          headers:
            Set-Cookie:
              description: Clears the role-scoped refresh cookie.
              schema: { type: string }
        '401': { description: Browser session is missing or expired }
        '403': { description: Origin is not trusted }

  /auth/company/complete-registration:
    post:
      tags: [Auth]
      summary: Verify company registration OTP and create password
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompleteCompanyRegistrationRequest' }
      responses:
        '200': { description: Password set; company remains pending admin approval }
        '401': { description: Invalid or expired OTP }

  /auth/company/forgot-password:
    post:
      tags: [Auth]
      summary: Request company password reset OTP by email
      description: |
        Always returns an anti-enumeration response. For an eligible account, delivery is queued
        asynchronously through the configured email or SMS provider.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompanyForgotPasswordRequest' }
      responses:
        '200':
          description: Generic OTP delivery acknowledgement
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OtpRequestAcceptedResponse' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /auth/company/reset-password:
    post:
      tags: [Auth]
      summary: Verify company password reset OTP and set a new password
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompanyResetPasswordRequest' }
      responses:
        '200': { description: Password reset }
        '401': { description: Invalid or expired OTP }

  /auth/admin/login:
    post:
      tags: [Auth]
      summary: Super admin login with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailPasswordLoginRequest' }
      responses:
        '200':
          description: JWT token pair
          content: { application/json: { schema: { $ref: '#/components/schemas/TokenResponse' } } }

  /auth/admin/web-login:
    post:
      tags: [Auth]
      security: []
      summary: Admin browser login
      description: |
        Requires an exact trusted Origin. Returns the short-lived access token in the response
        and sets the rotating admin refresh token in a role-scoped HttpOnly cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailPasswordLoginRequest' }
      responses:
        '200':
          description: Browser session started
          headers:
            Set-Cookie:
              description: Role-scoped HttpOnly refresh cookie; Secure is mandatory for SameSite=None.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebSessionResponse' }
        '401': { description: Invalid credentials }
        '403': { description: Origin is not trusted }

  /auth/admin/web-refresh:
    post:
      tags: [Auth]
      security: []
      summary: Rotate the admin browser refresh cookie
      description: |
        Requires an exact trusted Origin and the admin HttpOnly refresh cookie.
        The previous refresh token is revoked during rotation and is never returned in JSON.
      responses:
        '200':
          description: Browser session rotated
          headers:
            Set-Cookie:
              description: Newly rotated role-scoped HttpOnly refresh cookie.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebSessionResponse' }
        '401': { description: Browser session is missing, expired, or revoked }
        '403': { description: Origin is not trusted }

  /auth/admin/web-logout:
    post:
      tags: [Auth]
      security: []
      summary: Revoke and clear the admin browser session
      description: Requires an exact trusted Origin and revokes the refresh token from the HttpOnly cookie.
      responses:
        '204':
          description: Browser session revoked
          headers:
            Set-Cookie:
              description: Clears the role-scoped refresh cookie.
              schema: { type: string }
        '401': { description: Browser session is missing or expired }
        '403': { description: Origin is not trusted }

  /auth/admin/forgot-password:
    post:
      tags: [Auth]
      deprecated: true
      summary: Disabled public admin password-reset endpoint
      description: |
        This public recovery flow is intentionally disabled and always returns
        `410 ADMIN_PASSWORD_RESET_DISABLED` without disclosing whether an admin account exists.
        Admin recovery must follow the separately authorized operational recovery runbook.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminForgotPasswordRequest' }
      responses:
        '410':
          description: Public admin password recovery is disabled (`ADMIN_PASSWORD_RESET_DISABLED`)
          headers:
            X-Request-ID: { $ref: '#/components/headers/XRequestId' }
            X-Correlation-ID: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error: Public admin password recovery is disabled.
                code: ADMIN_PASSWORD_RESET_DISABLED
                request_id: 7fa22d18-6e54-4c33-8154-9f68f8e2f84b
                timestamp: "2030-01-15T10:00:00.000Z"
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/verify-otp:
    post:
      tags: [Auth]
      summary: Verify OTP for legacy registration/reset flows
      description: Password-based login is canonical. Login OTP purposes are deprecated and return OTP_LOGIN_DEPRECATED.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerifyOtpRequest' }
      responses:
        '200':
          description: OTP verified
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/TokenResponse'
                  - type: object
                    properties:
                      user_id: { type: string, format: uuid }
                      worker_id: { type: string, format: uuid }
                      status: { $ref: '#/components/schemas/WorkerStatus' }
                      password_required: { type: boolean }
                      otp_challenge: { type: string }
        '401':
          description: Invalid or expired OTP
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '429':
          description: OTP blocked after failed attempts
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Rotate refresh token and issue a new token pair
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200': { description: New token pair }
        '401': { description: Invalid refresh token }

  /auth/logout:
    post:
      tags: [Auth]
      security: [{ BearerAuth: [] }]
      summary: Revoke refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LogoutRequest' }
      responses:
        '204': { description: Logged out }

  /auth/fcm-token:
    post:
      tags: [Auth]
      security: [{ BearerAuth: [] }]
      summary: Register or update this device FCM token
      description: |
        Protected endpoint. The token is linked to the authenticated user and supports multiple devices per account.
        Use this after Worker, Company, or Admin login/refresh when Firebase returns a registration token.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FcmTokenRequest' }
            examples:
              android:
                value:
                  fcm_token: "fcm_registration_token_from_device"
                  platform: android
                  device_id: "android-installation-id"
      responses:
        '201':
          description: FCM token registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FcmTokenResponse' }
        '400': { description: Invalid token payload, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: Bearer token is missing or invalid, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    patch:
      tags: [Auth]
      security: [{ BearerAuth: [] }]
      deprecated: true
      summary: Deprecated compatibility wrapper for registering this device FCM token
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FcmTokenRequest' }
      responses:
        '200':
          description: FCM token registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FcmTokenResponse' }
    delete:
      tags: [Auth]
      security: [{ BearerAuth: [] }]
      summary: Deactivate this device FCM token
      description: Call before logout when possible. Local logout should still clear tokens even if this request fails.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fcm_token]
              properties:
                fcm_token:
                  type: string
                  minLength: 10
                  maxLength: 4096
                  example: "fcm_registration_token_from_device"
      responses:
        '204': { description: FCM token deactivated }
        '400': { description: Invalid token payload, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: Bearer token is missing or invalid, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /workers/me:
    get:
      tags: [Workers]
      security: [{ BearerAuth: [] }]
      summary: Get approved worker profile
      responses:
        '200': { description: Worker profile, content: { application/json: { schema: { $ref: '#/components/schemas/WorkerProfile' } } } }
        '403': { description: Worker is not approved }
    patch:
      tags: [Workers]
      security: [{ BearerAuth: [] }]
      summary: Update approved worker profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                skills: { type: array, items: { $ref: '#/components/schemas/Skill' } }
                languages: { type: array, items: { type: string } }
                email: { type: string, format: email, nullable: true, description: Optional worker email. Must be unique when provided. }
                work_history_summary: { type: string, nullable: true, maxLength: 2000 }
                work_history:
                  type: array
                  items: { $ref: '#/components/schemas/WorkExperience' }
                gender:
                  type: string
                  nullable: true
                  enum: [male, female]
                whatsapp_available: { type: boolean }
                availability: { type: boolean }
      responses:
        '200': { description: Updated worker profile }

  /workers/me/profile-photo:
    post:
      tags: [Workers]
      security: [{ BearerAuth: [] }]
      summary: Upload worker profile photo
      description: Approved workers can upload JPEG, PNG, or WebP profile photos. Local storage is dev-only; production should use S3/R2.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201': { description: Updated worker profile, content: { application/json: { schema: { $ref: '#/components/schemas/WorkerProfile' } } } }
        '400': { description: Invalid upload file, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Worker is not approved }

  /workers/me/documents:
    post:
      tags: [Workers]
      security: [{ BearerAuth: [] }]
      summary: Upload worker document
      description: Approved workers can upload PDF or image documents. Content is validated by extension, MIME, magic bytes, an image/PDF parser, and a malware scanner before promotion from quarantine to ready storage. `criminal_record` is private to worker/admin by default; `health_certificate` is company-visible.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [type, file]
              properties:
                type:
                  type: string
                  enum: [health_certificate, criminal_record]
                  example: health_certificate
                file:
                  type: string
                  format: binary
      responses:
        '201': { description: Updated worker profile, content: { application/json: { schema: { $ref: '#/components/schemas/WorkerProfile' } } } }
        '400': { description: Invalid upload file or document type, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Worker is not approved }
        '413': { description: Upload exceeds the five MiB limit, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '415': { description: Extension, declared MIME, or magic bytes are not allowed or do not match, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { description: Corrupt, active-content, polyglot, or malware-positive file, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '503': { description: Required malware scanner is unavailable, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /workers/me/documents/{type}:
    delete:
      tags: [Workers]
      security: [{ BearerAuth: [] }]
      operationId: deleteMyWorkerDocument
      summary: Delete one document owned by the authenticated worker
      description: The document metadata is replaced with a non-downloadable soft-delete tombstone and an audit event in one transaction. Only a worker can delete their own document. The owned private object is removed after commit on a best-effort basis; foreign or malformed keys are never deleted.
      parameters:
        - in: path
          name: type
          required: true
          schema: { type: string, enum: [health_certificate, criminal_record] }
      responses:
        '200':
          description: Document soft-deleted
          headers:
            X-Request-ID: { $ref: '#/components/headers/XRequestId' }
            X-Correlation-ID: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkerDocumentDeletionResponse' }
        '401': { description: Bearer token is missing or invalid, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Authenticated account is not an approved worker, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: Worker-owned document does not exist or was already deleted, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /workers/me/account-deletion-request:
    post:
      tags: [Workers]
      security: [{ BearerAuth: [] }]
      operationId: requestMyWorkerAccountDeletion
      summary: Request deletion of the authenticated worker account
      description: Immediately soft-deletes and anonymizes the worker-owned profile and authentication data, revokes sessions and device tokens, tombstones documents, and writes an append-only audit event in one transaction. Historical operational relations remain intact; no database row is hard-deleted.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkerAccountDeletionRequest' }
      responses:
        '202':
          description: Account deletion request accepted and applied
          headers:
            X-Request-ID: { $ref: '#/components/headers/XRequestId' }
            X-Correlation-ID: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkerAccountDeletionResponse' }
        '400': { description: Explicit confirmation is missing or invalid, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: Bearer token is missing or invalid, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Authenticated account is not a worker, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: Worker account does not exist, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /private-worker-documents/{token}:
    get:
      tags: [Workers]
      security: []
      operationId: downloadLocalPrivateWorkerDocument
      summary: Read a local-development private document capability URL
      description: |
        Local storage only. The opaque, short-lived signed token is the capability; responses are
        never cached and the token must not be logged, persisted, or forwarded. Production object
        storage returns its own short-lived signed URL instead.
      parameters:
        - in: path
          name: token
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        '200':
          description: Private document bytes
          headers:
            X-Request-ID: { $ref: '#/components/headers/XRequestId' }
            X-Correlation-ID: { $ref: '#/components/headers/XCorrelationId' }
            Cache-Control: { schema: { type: string }, description: "private, no-store, max-age=0" }
            Pragma: { schema: { type: string, enum: [no-cache] } }
            Content-Disposition: { schema: { type: string }, description: Forces download as an attachment. }
            X-Content-Type-Options: { schema: { type: string, enum: [nosniff] } }
            Content-Security-Policy: { schema: { type: string }, description: Blocks active document content in the browser. }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '404': { description: Token is invalid, expired, or the private object does not exist }

  /workers/{id}/documents/{type}/download:
    get:
      tags: [Workers]
      security: [{ BearerAuth: [] }]
      operationId: authorizeWorkerDocumentDownload
      summary: Authorize access and issue a short-lived private document URL
      description: |
        Worker ownership, related approved company visibility, or admin `view_workers` permission is
        required on every authorization request. Only ready documents with a clean scan result are
        eligible. The returned provider capability expires after at most fifteen minutes, is audit
        logged, and must not be logged, persisted, placed in analytics, or sent as a referrer.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: type
          required: true
          schema: { type: string, enum: [health_certificate, criminal_record] }
      responses:
        '200':
          description: Short-lived signed download URL
          headers:
            X-Request-ID: { $ref: '#/components/headers/XRequestId' }
            X-Correlation-ID: { $ref: '#/components/headers/XCorrelationId' }
            Cache-Control: { schema: { type: string }, description: "private, no-store, max-age=0" }
            Pragma: { schema: { type: string, enum: [no-cache] } }
          content:
            application/json:
              schema:
                type: object
                required: [url, expires_in_seconds, expires_at]
                properties:
                  url: { type: string }
                  expires_in_seconds: { type: integer, minimum: 1, maximum: 900, example: 300 }
                  expires_at: { type: string, format: date-time }
        '401': { description: Bearer token is missing or invalid }
        '403': { description: Caller is not allowed to access this document }
        '404': { description: Worker or document not found }
        '410': { description: Document is rejected, deleted, legacy-public, foreign, or not clean/ready }

  /workers/{id}/company-profile:
    get:
      tags: [Workers]
      security: [{ BearerAuth: [] }]
      summary: Get company-safe worker profile
      description: Approved company can view a safe worker profile only when the worker is assigned to one of its orders. Phone/email/private contact data is not returned.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Company-safe worker profile, content: { application/json: { schema: { $ref: '#/components/schemas/CompanyVisibleWorkerProfile' } } } }
        '403': { description: Company is not approved or cannot view this worker }
        '404': { description: Worker not found for this company }

  /companies/me:
    get:
      tags: [Companies]
      security: [{ BearerAuth: [] }]
      summary: Get approved company profile
      responses:
        '200': { description: Company profile, content: { application/json: { schema: { $ref: '#/components/schemas/CompanyProfile' } } } }
        '403': { description: Company is not approved }
    patch:
      tags: [Companies]
      security: [{ BearerAuth: [] }]
      summary: Update approved company profile
      responses:
        '200': { description: Updated company profile }

  /companies/me/documents:
    post:
      tags: [Companies]
      security: [{ BearerAuth: [] }]
      summary: Upload or replace a company document in private storage
      description: Accepts an approved access token or the narrow registration token returned after OTP/password completion. Files are quarantined, type-inspected, malware-scanned, and only clean files are promoted.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [type, file]
              properties:
                type: { type: string, enum: [registration_certificate, tax_certificate, operating_license, other] }
                file: { type: string, format: binary }
      responses:
        '201': { description: Sanitized company profile/document metadata; no storage key or raw URL is returned }
        '400': { description: Invalid type, file, MIME signature, or scan result }
        '401': { description: Access or registration token is invalid }
        '403': { description: Enrollment is closed }

  /companies/me/documents/{type}/download:
    get:
      tags: [Companies]
      security: [{ BearerAuth: [] }]
      summary: Authorize self-service company document download
      description: Issues an audited, short-lived private capability URL. Raw object keys and permanent document URLs are never returned.
      parameters:
        - in: path
          name: type
          required: true
          schema: { type: string, enum: [registration_certificate, tax_certificate, operating_license, other] }
      responses:
        '200': { description: Short-lived signed download URL }
        '401': { description: Access or registration token is invalid }
        '404': { description: Company or document not found }
        '410': { description: Legacy, foreign, or unscanned document must be uploaded again }

