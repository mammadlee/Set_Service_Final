      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateWorkerFocTrainingRequest' }
            examples:
              add:
                value:
                  worker_ids: ["{{worker_id_1}}", "{{worker_id_2}}"]
                  is_foc_training: true
                  note: "Təlim xərci SET Service tərəfindən qarşılanır."
              remove:
                value:
                  worker_ids: ["{{worker_id_1}}"]
                  is_foc_training: false
      responses:
        '200': { description: F.O.C. training status updated }
        '403': { description: Requires super_admin or admin with manage_workers, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: One or more workers were not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

