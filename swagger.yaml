      responses:
        '201':
          description: Kiosk session created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KioskSessionCreateResponse' }
              example:
                id: "{{kiosk_session_id}}"
                assignment_id: "{{assignment_id}}"
                order_id: "{{order_id}}"
                order_title: "Hilton Baku banket xidmeti"
                company_id: "{{company_id}}"
                company_name: "Hilton Baku"
                location: "Hilton Baku, Baki"
                category: "Ofisiant"
                status: active
                kiosk_status: active
                expires_at: "2030-01-15T22:00:00.000Z"
                revoked_at: null
                refresh_interval_seconds: 30
                kiosk_token: "{{kiosk_token}}"
                kiosk_url: "/kiosk#capability={{kiosk_token}}"
        '403':
          description: Company cannot create a kiosk for another company's assignment
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '404':
          description: Assignment not found
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '409':
          description: Assignment is not accepted/active
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /attendance/kiosk-sessions/context:
    get:
      tags: [Attendance]
      summary: Get public QR kiosk display context
      description: |
        Capability-protected display context. X-Kiosk-Capability carries the
        capability; the response never returns it, auth credentials, or signing secrets.
      parameters:
        - name: X-Kiosk-Capability
          in: header
          required: true
          schema: { type: string, minLength: 32 }
      responses:
        '200':
          description: Safe kiosk context
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KioskSession' }
        '404':
          description: Kiosk capability not found
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '410':
          description: Kiosk disabled, expired, revoked, or assignment/order inactive
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "QR ekrani deaktiv edilib.", code: KIOSK_SESSION_INACTIVE }

  /attendance/kiosk-sessions/qr-token:
    post:
      tags: [Attendance]
      summary: Generate fresh 30-second kiosk QR token
      description: |
        X-Kiosk-Capability carries the kiosk capability outside the URL. Generates a fresh signed attendance QR token every 30 seconds.
        The previous displayed QR expires according to expires_at and must not be treated as valid after expiry.
      parameters:
        - name: X-Kiosk-Capability
          in: header
          required: true
          schema: { type: string, minLength: 32 }
      responses:
        '200':
          description: Fresh kiosk QR token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KioskQrTokenResponse' }
              example:
                id: "{{kiosk_session_id}}"
                assignment_id: "{{assignment_id}}"
                order_id: "{{order_id}}"
                order_title: "Hilton Baku banket xidmeti"
                company_id: "{{company_id}}"
                company_name: "Hilton Baku"
                token: "{{attendance_qr_token}}"
                expires_at: "2030-01-15T10:00:30.000Z"
                refresh_after_seconds: 30
        '404':
          description: Kiosk capability not found
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '410':
          description: Kiosk disabled, expired, revoked, or assignment/order inactive
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /attendance/kiosk-sessions/{id}:
    delete:
      tags: [Attendance]
      security: [{ BearerAuth: [] }]
      summary: Revoke QR kiosk session
      description: Approved company can revoke its own kiosk sessions. Requires super_admin or admin with manage_kiosks to revoke any kiosk session.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Kiosk session revoked
        '403':
          description: Company cannot revoke another company's kiosk session
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '404':
          description: Kiosk session not found
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /attendance/qr-token:
    post:
      tags: [Attendance]
      security: [{ BearerAuth: [] }]
      summary: Generate signed attendance QR token
      description: |
        Requires super_admin or admin with manage_kiosks to generate QR for any accepted assignment. Approved company can generate QR only for assignments on its own orders.
        The token is signed, assignment/order/company bound, and may be regenerated for dynamic display every 30 seconds.

        Postman setup:
        1. Create an assignment and have the worker accept it.
        2. Save the assignment id as {{assignment_id}}.
        3. Call this endpoint and save token as {{attendance_qr_token}}.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GenerateAttendanceQrRequest' }
            examples:
              postman:
                value:
                  assignment_id: "{{assignment_id}}"
                  ttl_seconds: 60
      responses:
        '200':
          description: QR token generated
          content:
            application/json:
              example:
                assignment_id: "{{assignment_id}}"
                order_id: "{{order_id}}"
                order_title: "Hotel banquet service shift"
                company_id: "{{company_id}}"
                company_name: "SET Service MMC"
                token: "{{attendance_qr_token}}"
                expires_at: "2030-01-15T10:05:00.000Z"
                refresh_after_seconds: 30
        '403':
          description: Company cannot generate QR for this assignment
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '404':
          description: Assignment not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                assignmentNotFound:
                  value:
                    error: Assignment not found.
                    code: ASSIGNMENT_NOT_FOUND
        '409':
          description: Assignment is not accepted/active
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                assignmentNotAccepted:
                  value:
                    error: Assignment must be accepted and active before QR generation.
                    code: ASSIGNMENT_NOT_ACCEPTED

  /attendance/check-in:
    post:
      tags: [Attendance]
      security: [{ BearerAuth: [] }]
      summary: Check in to own accepted assignment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AttendanceCheckInRequest' }
            examples:
              postman:
                value:
                  assignment_id: "{{assignment_id}}"
                  qr_token: "{{attendance_qr_token}}"
                  location:
                    latitude: 40.4093
                    longitude: 49.8671
                    address: Grand Hotel Baku entrance
                  notes: Arrived on time.
      responses:
        '201':
          description: Check-in recorded
          content: { application/json: { schema: { $ref: '#/components/schemas/AttendanceLog' } } }
        '400':
          description: Validation error
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '401':
          description: QR token invalid
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                invalid:
                  value: { error: QR token is invalid., code: QR_TOKEN_INVALID }
        '403':
          description: Worker cannot check in for another worker assignment
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '404':
          description: Assignment not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                assignmentNotFound:
                  value: { error: Assignment not found., code: ASSIGNMENT_NOT_FOUND }
        '409':
          description: Assignment not accepted, duplicate open attendance, or completed attendance exists
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                notAccepted:
                  value: { error: Assignment must be accepted and active before check-in., code: ASSIGNMENT_NOT_ACCEPTED }
                alreadyCheckedIn:
                  value: { error: Attendance is already checked in for this assignment., code: ATTENDANCE_ALREADY_CHECKED_IN }
                alreadyCompleted:
                  value: { error: Attendance session is already completed for this assignment., code: ATTENDANCE_ALREADY_COMPLETED }
        '410':
          description: QR token expired
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                expired:
                  value: { error: QR token has expired., code: QR_TOKEN_EXPIRED }

  /attendance/check-out:
    post:
      tags: [Attendance]
      security: [{ BearerAuth: [] }]
      summary: Check out from own accepted assignment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AttendanceCheckOutRequest' }
            examples:
              postman:
                value:
                  assignment_id: "{{assignment_id}}"
                  qr_token: "{{attendance_qr_token}}"
                  notes: Shift completed.
      responses:
        '200':
          description: Check-out recorded
          content: { application/json: { schema: { $ref: '#/components/schemas/AttendanceLog' } } }
        '400':
          description: No open check-in exists
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                notCheckedIn:
                  value: { error: Attendance has no open check-in for this assignment., code: ATTENDANCE_NOT_CHECKED_IN }
        '401':
          description: QR token invalid
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                invalid:
                  value: { error: QR token is invalid., code: QR_TOKEN_INVALID }
        '403':
          description: Worker cannot check out another worker assignment
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '404':
          description: Assignment not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                assignmentNotFound:
                  value: { error: Assignment not found., code: ASSIGNMENT_NOT_FOUND }
        '409':
          description: Assignment is not accepted/active
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                notAccepted:
                  value: { error: Assignment must be accepted and active before checkout., code: ASSIGNMENT_NOT_ACCEPTED }
        '410':
          description: QR token expired
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                expired:
                  value: { error: QR token has expired., code: QR_TOKEN_EXPIRED }

  /attendance:
    get:
      tags: [Attendance]
      security: [{ BearerAuth: [] }]
      summary: List attendance records
      description: Requires super_admin or admin with view_attendance to see all. Company sees own order assignment attendance. Worker sees own attendance.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: assignment_id
          in: query
          schema: { type: string, format: uuid }
        - name: order_id
          in: query
          schema: { type: string, format: uuid }
        - name: worker_id
          in: query
          schema: { type: string, format: uuid }
        - name: open_only
          in: query
          schema: { type: boolean }
        - name: sort
          in: query
          schema: { type: string, enum: [asc, desc], default: desc }
      responses:
        '200':
          description: Paginated attendance records
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttendanceListResponse' }
              example:
                data:
                  - id: "{{attendance_id}}"
                    assignment_id: "{{assignment_id}}"
                    checkin_time: "2030-01-15T10:00:00.000Z"
                    checkout_time: "2030-01-15T18:00:00.000Z"
                    duration_minutes: 480
                    checkin_location:
                      latitude: 40.4093
                      longitude: 49.8671
                      address: Grand Hotel Baku entrance
                    checkout_location:
                      latitude: 40.4093
                      longitude: 49.8671
                      address: Grand Hotel Baku exit
                    checkin_notes: Arrived on time.
                    checkout_notes: Shift completed.
                    created_at: "2030-01-15T10:00:00.000Z"
                    updated_at: "2030-01-15T18:00:00.000Z"
                    assignment:
                      id: "{{assignment_id}}"
                      status: accepted
                      worker:
                        id: "{{worker_id_1}}"
                        name: Ali Hasanov
                        phone: "+994501234567"
                      order:
                        id: "{{order_id}}"
                        title: Banquet service shift
                        status: active
                        company:
                          id: "{{company_id}}"
                          name: Grand Hotel Baku
                meta:
                  page: 1
                  limit: 20
                  total: 1
                  total_pages: 1
        '403':
          description: Account cannot view requested attendance records
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                forbidden:
                  value: { error: Workers can view only their own attendance records., code: FORBIDDEN }

  /attendance/{id}:
    get:
      tags: [Attendance]
      security: [{ BearerAuth: [] }]
      summary: Get attendance record
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Attendance record
          content: { application/json: { schema: { $ref: '#/components/schemas/AttendanceLog' } } }
        '403':
          description: Account cannot view this attendance record
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '404':
          description: Attendance not found or not visible
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /ratings:
    post:
      tags: [Ratings]
      security: [{ BearerAuth: [] }]
      summary: Company rates worker after completed checkout
      description: Approved company can rate only its own assignment after attendance checkout is completed. Duplicate rating for the same assignment/order/worker is rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRatingRequest' }
            examples:
              assignment:
                summary: Primary mode
                value:
                  assignment_id: "{{assignment_id}}"
                  score: 5
                  feedback: İşçi növbəni vaxtında və keyfiyyətlə tamamladı.
              legacyOrderWorker:
                summary: Legacy alternative mode
                value:
                  order_id: "{{order_id}}"
                  worker_id: "{{worker_id_1}}"
                  score: 5
                  feedback: İşçi növbəni vaxtında və keyfiyyətlə tamamladı.
      responses:
        '201': { description: Rating created, content: { application/json: { schema: { $ref: '#/components/schemas/Rating' } } } }
        '400': { description: Validation error, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Company only or company not approved, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409':
          description: Rating unavailable or duplicate
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                notAvailable:
                  value: { error: Worker can be rated only after a completed attendance checkout for this company assignment., code: RATING_NOT_AVAILABLE }
                duplicate:
                  value: { error: This assignment has already been rated., code: DUPLICATE_RATING }

  /ratings/me:
    get:
      tags: [Ratings]
      security: [{ BearerAuth: [] }]
      summary: Worker rating summary and history
      responses:
        '200': { description: Own rating history, content: { application/json: { schema: { $ref: '#/components/schemas/RatingSummary' } } } }
        '403': { description: Worker only or worker not approved, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /ratings/worker/{worker_id}:
    get:
      tags: [Ratings]
      security: [{ BearerAuth: [] }]
      summary: Get worker rating history (admin)
      parameters:
        - name: worker_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Worker ratings, content: { application/json: { schema: { $ref: '#/components/schemas/RatingSummary' } } } }
        '403': { description: Requires super_admin or admin with view_workers, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /workers/{id}/ratings:
    get:
      tags: [Ratings]
      security: [{ BearerAuth: [] }]
      summary: Get worker rating history (admin canonical route)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Worker ratings, content: { application/json: { schema: { $ref: '#/components/schemas/RatingSummary' } } } }
        '403': { description: Requires super_admin or admin with view_workers, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: Worker not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

tags:
  - name: Auth
  - name: Workers
  - name: Companies
  - name: Admin - Workers
  - name: Admin - Companies
  - name: Admin - Admins
  - name: Admin - Reports
  - name: Notifications
  - name: Orders
  - name: Assignments
  - name: Attendance
  - name: Ratings
