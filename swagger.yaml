                        assigned_count: 0
                        remaining_count: 2
                      - id: "{{dishwasher_category_item_id}}"
                        category: dishwasher
                        required_count: 1
                        assigned_count: 0
                        remaining_count: 1
                    start_datetime: "2030-01-15T10:00:00.000Z"
                    end_datetime: "2030-01-15T18:00:00.000Z"
                    location: Grand Hotel Baku, Baku
                    status: active
                    version: 1
                    assignment_count: 0
                meta: { page: 1, limit: 20, total: 1, total_pages: 1 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    post:
      tags: [Orders]
      security: [{ BearerAuth: [] }]
      summary: Create order as approved company
      description: |
        Worker and super admin tokens cannot create orders. Company must be approved.
        Production clients should send a stable `Idempotency-Key` for each logical create attempt.
        Repeating the same key with the same body returns the original response; reusing it with
        a different body returns `409 IDEMPOTENCY_KEY_REUSED`. Matching keys remain scoped to the
        authenticated actor and `orders.create` operation for 24 hours. A matching request still being
        processed returns `409 IDEMPOTENCY_REQUEST_IN_PROGRESS`; retry it with the same key after backoff.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: Client-generated key that uniquely identifies one logical order creation attempt.
          schema:
            type: string
            minLength: 8
            maxLength: 200
            pattern: '^[A-Za-z0-9._:-]+$'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOrderRequest' }
            examples:
              postman:
                summary: Postman-ready order create body
                value:
                  title: Banquet service shift
                  description: Waiter and kitchen support for an evening hotel banquet.
                  category: hospitality
                  required_count: 6
                  category_items:
                    - category: Waiter/Waitress
                      department_id: "{{department_id}}"
                      subdepartment_id: "{{subdepartment_id}}"
                      position_id: "{{waiter_position_id}}"
                      required_count: 3
                      notes: White shirt uniform required.
                    - category: Bartender
                      department_id: "{{department_id}}"
                      subdepartment_id: "{{bar_subdepartment_id}}"
                      position_id: "{{bartender_position_id}}"
                      required_count: 2
                    - category: dishwasher
                      required_count: 1
                  start_datetime: "2030-01-15T10:00:00.000Z"
                  end_datetime: "2030-01-15T18:00:00.000Z"
                  location: Grand Hotel Baku, Baku
                  pay_rate: 18.5
                  required_skills: [waiter, chef]
                  notes: Formal dress required.
      responses:
        '201':
          description: Order created or the original idempotent response replayed
          headers:
            X-Request-ID: { $ref: '#/components/headers/XRequestId' }
            X-Correlation-ID: { $ref: '#/components/headers/XCorrelationId' }
            Idempotency-Replayed:
              description: "true when this response was replayed from a previous matching request."
              schema: { type: boolean }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400':
          description: Invalid date window or request body
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '403':
          description: Company is not approved or role cannot create orders
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '409':
          description: |
            Idempotency key was used with a different body (`IDEMPOTENCY_KEY_REUSED`) or the matching
            original request is still pending (`IDEMPOTENCY_REQUEST_IN_PROGRESS`).
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /orders/{id}:
    get:
      tags: [Orders]
      security: [{ BearerAuth: [] }]
      summary: Get order details
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Order detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '403':
          description: Company can access only its own orders
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '404':
          description: Order not found
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /orders/{id}/cancel:
    patch:
      tags: [Orders]
      security: [{ BearerAuth: [] }]
      summary: Cancel own order as an approved company
      description: |
        Only the approved company owner can cancel its own order. Super admin cannot cancel orders for now.
        Cancellation is transactional: active assignments and kiosk sessions are revoked and notification/outbox
        records are created together. A completed order is terminal (`400 ORDER_ALREADY_COMPLETED`); a second
        cancellation is rejected (`409 ORDER_ALREADY_CANCELLED`). Cancellation is also rejected while an open
        attendance session exists (`409 ORDER_HAS_ACTIVE_ATTENDANCE`). Clients should send the current order
        `version` as `expected_version`; stale writes return `409 ORDER_VERSION_CONFLICT`.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CancelOrderRequest' }
            examples:
              postman:
                value:
                  reason: Client cancelled the event.
                  expected_version: 3
      responses:
        '200':
          description: Order cancelled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400':
          description: Completed orders cannot be cancelled
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '403':
          description: Worker and super admin roles cannot cancel orders
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '409':
          description: |
            Order is already cancelled, has an open attendance session, changed concurrently, or the supplied
            version is stale (`ORDER_ALREADY_CANCELLED`, `ORDER_HAS_ACTIVE_ATTENDANCE`,
            `ORDER_CANCEL_CONFLICT`, or `ORDER_VERSION_CONFLICT`).
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /orders/{id}/assign:
    post:
      tags: [Assignments]
      security: [{ BearerAuth: [] }]
      deprecated: true
      summary: Deprecated compatibility route for assigning workers to an order
      description: |
        Legacy wrapper for older clients. New integrations must use `POST /assignments`.
        Requires super_admin or admin with manage_assignments. The order id is taken from the path and
        worker ids are provided in the request body. This route is kept only for
        single-category compatibility and is not suitable for multi-category orders;
        use `POST /assignments` with `order_category_item_id` instead.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [worker_ids]
              properties:
                worker_ids:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: { type: string, format: uuid }
            examples:
              postman:
                value:
                  worker_ids:
                    - "{{worker_id_1}}"
                    - "{{worker_id_2}}"
      responses:
        '201':
          description: Assignments created through compatibility wrapper
          content:
            application/json:
              example:
                assigned_count: 2
                assignments:
                  - id: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa
                    order_id: "{{order_id}}"
                    worker_id: "{{worker_id_1}}"
                    status: assigned
        '400':
          description: Invalid worker list or workers unavailable
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '403':
          description: Requires super_admin or admin with manage_assignments
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '409':
          description: Order inactive, duplicate assignment, or capacity exceeded
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /assignments:
    post:
      tags: [Assignments]
      security: [{ BearerAuth: [] }]
      summary: Assign approved available workers to an active order
      description: |
        Requires super_admin or admin with manage_assignments. Capacity is category-aware when the order has category_items.

        Postman setup:
        1. Create an order and copy its id into {{order_id}}.
        2. Copy the needed category item id from the order response into {{order_category_item_id}}.
        3. List approved workers and copy worker ids into {{worker_id_1}} and {{worker_id_2}}.
        4. Use a super admin Bearer token for this request.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAssignmentsRequest' }
            examples:
              postman:
                value:
                  order_id: "{{order_id}}"
                  assignments:
                    - worker_id: "{{worker_id_1}}"
                      order_category_item_id: "{{order_category_item_id}}"
                    - worker_id: "{{worker_id_2}}"
                      order_category_item_id: "{{order_category_item_id}}"
      responses:
        '201':
          description: Assignments created
          content:
            application/json:
              example:
                assigned_count: 2
                assignments:
                  - id: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa
                    order_id: 6f6f09a0-0b32-47ea-ae22-8b35d7e0c111
                    worker_id: 11111111-1111-4111-8111-111111111111
                    category: waiter
                    order_category_item_id: "{{order_category_item_id}}"
                    status: assigned
        '400':
          description: Worker missing, worker not approved, or worker unavailable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                workersNotAvailable:
                  value:
                    error: All assigned workers must be approved and available.
                    code: WORKERS_NOT_AVAILABLE
        '403':
          description: Requires super_admin or admin with manage_assignments
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '409':
          description: Order inactive, duplicate assignment, or capacity exceeded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                orderNotActive:
                  value:
                    error: Order must exist and be active before workers can be assigned.
                    code: ORDER_NOT_ACTIVE
                duplicateAssignment:
                  value:
                    error: One or more workers are already assigned to this order.
                    code: DUPLICATE_ASSIGNMENT
                capacityExceeded:
                  value:
                    error: Assignment count cannot exceed required worker count for this category.
                    code: ORDER_CAPACITY_EXCEEDED
                    details: { category: waiter }
                categoryRequired:
                  value:
                    error: Assignment category is required for multi-category orders.
                    code: ASSIGNMENT_CATEGORY_REQUIRED
                invalidCategory:
                  value:
                    error: Selected order category was not found.
                    code: INVALID_ORDER_CATEGORY
    get:
      tags: [Assignments]
      security: [{ BearerAuth: [] }]
      summary: List assignments
      description: Requires super_admin or admin with view_assignments to see all. Company sees assignments for its own orders. Worker sees only own assignments.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/AssignmentStatus' }
        - name: order_id
          in: query
          schema: { type: string, format: uuid }
        - name: worker_id
          in: query
          schema: { type: string, format: uuid }
        - name: sort
          in: query
          schema: { type: string, enum: [asc, desc], default: desc }
      responses:
        '200':
          description: Paginated assignments
          content:
            application/json:
              example:
                data:
                  - id: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa
                    order_id: 6f6f09a0-0b32-47ea-ae22-8b35d7e0c111
                    worker_id: 11111111-1111-4111-8111-111111111111
                    category: waiter
                    order_category_item_id: "{{order_category_item_id}}"
                    status: assigned
                meta: { page: 1, limit: 20, total: 1, total_pages: 1 }
        '403':
          description: Role/account cannot view requested assignments
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /assignments/{id}:
