openapi: 3.0.3

info:
  title: HireApp API
  version: 1.0.0
  description: |
    HireApp MVP REST API for Worker, Company, and Super Admin roles.

    Core worker flow:
    Worker registers -> verifies OTP -> becomes pending_approval -> super admin approves or rejects -> approved worker can request login OTP and receive tokens.

servers:
  - url: http://localhost:3000/v1
    description: Local development
  - url: https://api.hireapp.az/v1
    description: Production

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

  schemas:
    Error:
      type: object
      properties:
        error: { type: string, example: Worker is not approved for login. }
        code: { type: string, example: WORKER_NOT_APPROVED }
        details: { type: object, nullable: true, example: { status: pending_approval } }
        timestamp: { type: string, format: date-time }

    PaginationMeta:
      type: object
      properties:
        page: { type: integer, example: 1 }
        limit: { type: integer, example: 20 }
        total: { type: integer, example: 42 }
        total_pages: { type: integer, example: 3 }

    WorkerStatus:
      type: string
      enum: [draft, pending_otp, pending_approval, approved, rejected, suspended, inactive]
      example: pending_approval

    CompanyStatus:
      type: string
      enum: [pending_approval, approved, rejected, suspended, inactive]
      example: approved

    Skill:
      oneOf:
        - type: string
          example: waiter
        - type: object
          properties:
            name: { type: string, example: waiter }
            level: { type: integer, minimum: 1, maximum: 5, example: 4 }

    Document:
      type: object
      required: [type, url]
      properties:
        type: { type: string, example: passport }
        url: { type: string, format: uri, example: https://cdn.example.com/documents/passport.pdf }
        name: { type: string, example: Passport scan }

    WorkerRegisterRequest:
      type: object
      required: [full_name, phone, position]
      properties:
        full_name: { type: string, example: Ali Hasanov }
        phone: { type: string, example: "+994501234567" }
        position: { type: string, example: Waiter }
        skills:
          type: array
          items: { $ref: '#/components/schemas/Skill' }
        languages:
          type: array
          items: { type: string }
          example: [az, en]
        documents:
          type: array
          items: { $ref: '#/components/schemas/Document' }

    CompanyRegisterRequest:
      type: object
      required: [name, contact_name, phone]
      properties:
        name: { type: string, example: Grand Hotel Baku }
        contact_name: { type: string, example: Nigar Aliyeva }
        phone: { type: string, example: "+994501234568" }
        docs_url: { type: string, format: uri }
        documents:
          type: array
          items: { $ref: '#/components/schemas/Document' }

    RequestOtpRequest:
      type: object
      required: [phone]
      properties:
        phone: { type: string, example: "+994501234567" }
        purpose:
          type: string
          enum: [worker_registration, worker_login]
          example: worker_login

    LoginRequest:
      type: object
      required: [phone]
      properties:
        phone: { type: string, example: "+994501234567" }

    VerifyOtpRequest:
      type: object
      required: [phone, otp_code]
      properties:
        phone: { type: string, example: "+994501234567" }
        otp_code:
          type: string
          example: "123456"
          description: Development only when OTP_TEST_MODE=true.
        purpose:
          type: string
          enum: [worker_registration, worker_login, company_registration, company_login, admin_login]
          example: worker_registration

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: { type: string }

    LogoutRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: { type: string }

    TokenResponse:
      type: object
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        user:
          type: object
          properties:
            id: { type: string, format: uuid }
            phone: { type: string }
            role: { type: string, enum: [super_admin, company, worker] }
            name: { type: string }
            worker:
              type: object
              nullable: true
              properties:
                id: { type: string, format: uuid }
                status: { $ref: '#/components/schemas/WorkerStatus' }
            company:
              type: object
              nullable: true
              properties:
                id: { type: string, format: uuid }
                status: { $ref: '#/components/schemas/CompanyStatus' }

    WorkerProfile:
      type: object
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        name: { type: string }
        phone: { type: string }
        position: { type: string }
        skills:
          type: array
          items: { $ref: '#/components/schemas/Skill' }
        languages:
          type: array
          items: { type: string }
        documents:
          type: array
          items: { $ref: '#/components/schemas/Document' }
        status: { $ref: '#/components/schemas/WorkerStatus' }
        reject_reason: { type: string, nullable: true }
        availability: { type: boolean }
        rating_avg: { type: number, example: 4.5 }
        rating_count: { type: integer, example: 12 }
        created_at: { type: string, format: date-time }

    CompanyProfile:
      type: object
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        name: { type: string }
        contact_name: { type: string }
        phone: { type: string }
        status: { $ref: '#/components/schemas/CompanyStatus' }
        docs_url: { type: string, nullable: true }
        reject_reason: { type: string, nullable: true }
        created_at: { type: string, format: date-time }

    RejectRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 3, example: Documents are incomplete. }

    Notification:
      type: object
      properties:
        id: { type: string, format: uuid }
        type:
          type: string
          enum: [worker_approved, worker_rejected, company_approved, company_rejected, job_assigned, system]
        channel:
          type: string
          enum: [in_app, sms, email, push]
        title: { type: string }
        body: { type: string }
        metadata: { type: object }
        read_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    Order:
      type: object
      properties:
        id: { type: string, format: uuid }
        company_id: { type: string, format: uuid }
        shift_start: { type: string, format: date-time }
        shift_end: { type: string, format: date-time }
        required_count: { type: integer }
        required_skills:
          type: array
          items: { type: string }
        status: { type: string, enum: [draft, active, completed, cancelled] }

paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Compatibility registration endpoint for worker or company
      description: Prefer /auth/worker/register and /auth/company/register for new clients.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - allOf:
                    - $ref: '#/components/schemas/WorkerRegisterRequest'
                    - type: object
                      required: [role]
                      properties:
                        role: { type: string, enum: [worker] }
                - allOf:
                    - $ref: '#/components/schemas/CompanyRegisterRequest'
                    - type: object
                      required: [role]
                      properties:
                        role: { type: string, enum: [company] }
      responses:
        '201': { description: Account created and OTP sent }

  /auth/worker/register:
    post:
      tags: [Auth]
      summary: Register worker and send registration OTP
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkerRegisterRequest' }
      responses:
        '201': { description: Worker created with pending_otp status }
        '409':
          description: Phone already registered
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /auth/worker/request-otp:
    post:
      tags: [Auth]
      summary: Request worker OTP for login or registration resend
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RequestOtpRequest' }
      responses:
        '200': { description: OTP sent or generic safe response }
        '403':
          description: Worker is not approved or registration is not pending OTP
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '429':
          description: OTP cooldown, rate limit, or temporary block
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /auth/worker/login:
    post:
      tags: [Auth]
      summary: Start approved worker OTP login
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200': { description: OTP sent }
        '403':
          description: Worker is pending_approval, rejected, suspended, inactive, or unknown
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /auth/company/register:
    post:
      tags: [Auth]
      summary: Register company and send OTP
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompanyRegisterRequest' }
      responses:
        '201': { description: Company created with pending_approval status }

  /auth/company/login:
    post:
      tags: [Auth]
      summary: Start approved company OTP login
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200': { description: OTP sent }
        '403': { description: Company is not approved }

  /auth/admin/login:
    post:
      tags: [Auth]
      summary: Start super admin OTP login
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200': { description: OTP sent or generic safe response }

  /auth/verify-otp:
    post:
      tags: [Auth]
      summary: Verify OTP; registration OTP updates status, login OTP returns tokens
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerifyOtpRequest' }
      responses:
        '200':
          description: OTP verified
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/TokenResponse'
                  - type: object
                    properties:
                      user_id: { type: string, format: uuid }
                      worker_id: { type: string, format: uuid }
                      status: { $ref: '#/components/schemas/WorkerStatus' }
        '401':
          description: Invalid or expired OTP
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '429':
          description: OTP blocked after failed attempts
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Rotate refresh token and issue a new token pair
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200': { description: New token pair }
        '401': { description: Invalid refresh token }

  /auth/logout:
    post:
      tags: [Auth]
      security: [{ BearerAuth: [] }]
      summary: Revoke refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LogoutRequest' }
      responses:
        '204': { description: Logged out }

  /auth/fcm-token:
    patch:
      tags: [Auth]
      security: [{ BearerAuth: [] }]
      summary: Update current user's FCM token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fcm_token]
              properties:
                fcm_token: { type: string }
      responses:
        '204': { description: FCM token updated }

  /workers/me:
    get:
      tags: [Workers]
      security: [{ BearerAuth: [] }]
      summary: Get approved worker profile
      responses:
        '200': { description: Worker profile, content: { application/json: { schema: { $ref: '#/components/schemas/WorkerProfile' } } } }
        '403': { description: Worker is not approved }
    patch:
      tags: [Workers]
      security: [{ BearerAuth: [] }]
      summary: Update approved worker profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                skills: { type: array, items: { $ref: '#/components/schemas/Skill' } }
                languages: { type: array, items: { type: string } }
                documents: { type: array, items: { $ref: '#/components/schemas/Document' } }
                availability: { type: boolean }
      responses:
        '200': { description: Updated worker profile }

  /companies/me:
    get:
      tags: [Companies]
      security: [{ BearerAuth: [] }]
      summary: Get approved company profile
      responses:
        '200': { description: Company profile, content: { application/json: { schema: { $ref: '#/components/schemas/CompanyProfile' } } } }
        '403': { description: Company is not approved }
    patch:
      tags: [Companies]
      security: [{ BearerAuth: [] }]
      summary: Update approved company profile
      responses:
        '200': { description: Updated company profile }

  /admin/workers:
    get:
      tags: [Admin - Workers]
      security: [{ BearerAuth: [] }]
      summary: List workers with pagination, search, status filter, and created_at sort
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: search
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/WorkerStatus' }
        - name: sort
          in: query
          schema: { type: string, enum: [asc, desc], default: desc }
      responses:
        '200': { description: Paginated workers }
        '403': { description: Super admin only }

  /admin/workers/{id}:
    get:
      tags: [Admin - Workers]
      security: [{ BearerAuth: [] }]
      summary: Get full worker details, documents, OTP status, and approval status
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Worker detail }
        '404': { description: Worker not found }

  /admin/workers/{id}/approve:
    patch:
      tags: [Admin - Workers]
      security: [{ BearerAuth: [] }]
      summary: Approve worker, create audit log, and notify worker
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Worker approved }

  /admin/workers/{id}/reject:
    patch:
      tags: [Admin - Workers]
      security: [{ BearerAuth: [] }]
      summary: Reject worker with reason, create audit log, and notify worker
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RejectRequest' }
      responses:
        '200': { description: Worker rejected }

  /admin/companies:
    get:
      tags: [Admin - Companies]
      security: [{ BearerAuth: [] }]
      summary: List companies
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/CompanyStatus' }
        - name: search
          in: query
          schema: { type: string }
      responses:
        '200': { description: Paginated companies }

  /admin/companies/{id}:
    get:
      tags: [Admin - Companies]
      security: [{ BearerAuth: [] }]
      summary: Get company details
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Company detail }
        '404': { description: Company not found }

  /admin/companies/{id}/approve:
    patch:
      tags: [Admin - Companies]
      security: [{ BearerAuth: [] }]
      summary: Approve company
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Company approved }

  /admin/companies/{id}/reject:
    patch:
      tags: [Admin - Companies]
      security: [{ BearerAuth: [] }]
      summary: Reject company
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RejectRequest' }
      responses:
        '200': { description: Company rejected }

  /notifications:
    get:
      tags: [Notifications]
      security: [{ BearerAuth: [] }]
      summary: List my in-app notifications
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: unread_only
          in: query
          schema: { type: boolean }
      responses:
        '200': { description: Paginated notifications }

  /notifications/{id}/read:
    patch:
      tags: [Notifications]
      security: [{ BearerAuth: [] }]
      summary: Mark one notification as read
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Notification marked read }

  /notifications/read-all:
    patch:
      tags: [Notifications]
      security: [{ BearerAuth: [] }]
      summary: Mark all notifications as read
      responses:
        '200': { description: Notifications marked read }

  /orders:
    get:
      tags: [Orders]
      security: [{ BearerAuth: [] }]
      summary: List orders for company or all orders for super admin
      responses:
        '200': { description: Orders list }
    post:
      tags: [Orders]
      security: [{ BearerAuth: [] }]
      summary: Create order as approved company
      responses:
        '201': { description: Order created }

  /orders/{id}:
    get:
      tags: [Orders]
      security: [{ BearerAuth: [] }]
      summary: Get order details
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Order detail }
    patch:
      tags: [Orders]
      security: [{ BearerAuth: [] }]
      summary: Cancel an order
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [cancelled] }
      responses:
        '200': { description: Order cancelled }

  /orders/{id}/assign:
    post:
      tags: [Assignments]
      security: [{ BearerAuth: [] }]
      summary: Assign approved workers to an active order
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Workers assigned }

  /assignments/me:
    get:
      tags: [Assignments]
      security: [{ BearerAuth: [] }]
      summary: List approved worker assignments
      responses:
        '200': { description: Assignments }

  /assignments/{id}/status:
    patch:
      tags: [Assignments]
      security: [{ BearerAuth: [] }]
      summary: Accept or reject an assignment as approved worker
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [accepted, rejected] }
      responses:
        '200': { description: Assignment status updated }

  /attendance/qr-token:
    get:
      tags: [Attendance]
      security: [{ BearerAuth: [] }]
      summary: Generate QR token for approved company
      responses:
        '200': { description: QR token }

  /attendance/checkin:
    post:
      tags: [Attendance]
      security: [{ BearerAuth: [] }]
      summary: Check in with QR token as approved worker
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [qr_token]
              properties:
                qr_token: { type: string }
      responses:
        '200': { description: Check-in recorded }

  /attendance/checkout:
    post:
      tags: [Attendance]
      security: [{ BearerAuth: [] }]
      summary: Check out with QR token as approved worker
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [qr_token]
              properties:
                qr_token: { type: string }
      responses:
        '200': { description: Check-out recorded }

  /ratings:
    post:
      tags: [Ratings]
      security: [{ BearerAuth: [] }]
      summary: Create worker rating
      responses:
        '201': { description: Rating created }

  /ratings/worker/{worker_id}:
    get:
      tags: [Ratings]
      security: [{ BearerAuth: [] }]
      summary: Get worker rating history
      parameters:
        - name: worker_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Worker ratings }

tags:
  - name: Auth
  - name: Workers
  - name: Companies
  - name: Admin - Workers
  - name: Admin - Companies
  - name: Notifications
  - name: Orders
  - name: Assignments
  - name: Attendance
  - name: Ratings
