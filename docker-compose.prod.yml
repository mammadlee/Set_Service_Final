name: set-service

x-json-logging: &json-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

services:
  redis:
    image: ${REDIS_IMAGE:?Set REDIS_IMAGE to a pinned Redis image in .env}
    restart: unless-stopped
    cpus: 0.50
    mem_limit: 768m
    pids_limit: 200
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - noeviction
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    logging: *json-logging
    networks:
      - backend

  api:
    image: setservice-api:${RELEASE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
      target: api
      args:
        NODE_BASE_IMAGE: ${NODE_BASE_IMAGE:?Set NODE_BASE_IMAGE to the approved pinned Node image in .env}
    restart: unless-stopped
    cpus: 1.50
    mem_limit: 2g
    pids_limit: 300
    env_file:
      - ${APP_ENV_FILE:-.env}
    environment:
      NODE_ENV: production
      PORT: "3000"
      REDIS_URL: redis://redis:6379
      OUTBOX_WORKER_ENABLED: "false"
      RELEASE_SHA: ${RELEASE_SHA:-unknown}
    expose:
      - "3000"
    depends_on:
      redis:
        condition: service_healthy
        restart: true
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s
    logging: *json-logging
    networks:
      - proxy
      - backend
      - egress

  outbox-worker:
    image: setservice-outbox:${RELEASE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
      target: outbox-worker
      args:
        NODE_BASE_IMAGE: ${NODE_BASE_IMAGE:?Set NODE_BASE_IMAGE to the approved pinned Node image in .env}
    restart: unless-stopped
    cpus: 0.75
    mem_limit: 1g
    pids_limit: 250
    env_file:
      - ${APP_ENV_FILE:-.env}
    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      OUTBOX_WORKER_ENABLED: "false"
      OUTBOX_HEALTH_PORT: "3001"
      RELEASE_SHA: ${RELEASE_SHA:-unknown}
    expose:
      - "3001"
    depends_on:
      redis:
        condition: service_healthy
        restart: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s
    logging: *json-logging
    networks:
      - backend
      - egress

  migrate:
    image: setservice-migration:${RELEASE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
      target: migration
      args:
        NODE_BASE_IMAGE: ${NODE_BASE_IMAGE:?Set NODE_BASE_IMAGE to the approved pinned Node image in .env}
    profiles: ["tools"]
    cpus: 1.50
    mem_limit: 2g
    pids_limit: 300
    env_file:
      - ${APP_ENV_FILE:-.env}
    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      OUTBOX_WORKER_ENABLED: "false"
      RELEASE_SHA: ${RELEASE_SHA:-unknown}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *json-logging
    networks:
      - egress

  caddy:
    image: ${CADDY_IMAGE:?Set CADDY_IMAGE to a pinned Caddy image in .env}
    restart: unless-stopped
    cpus: 0.50
    mem_limit: 512m
    pids_limit: 200
    environment:
      API_DOMAIN: ${API_DOMAIN:?Set API_DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
        restart: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *json-logging
    networks:
      - proxy

volumes:
  redis_data:
  caddy_data:
  caddy_config:

networks:
  proxy:
    driver: bridge
    ipam:
      config:
        - subnet: ${PROXY_SUBNET:-172.30.0.0/24}
  backend:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: ${BACKEND_SUBNET:-172.31.0.0/24}
  egress:
    driver: bridge
    ipam:
      config:
        - subnet: ${EGRESS_SUBNET:-172.32.0.0/24}
