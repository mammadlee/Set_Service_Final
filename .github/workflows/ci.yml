  qr-kiosk:
    name: QR Kiosk Web
    runs-on: ubuntu-latest
    env:
      VITE_API_BASE_URL: ${{ github.event_name == 'pull_request' && 'https://api.ci.setservice.az' || vars.PRODUCTION_API_BASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

