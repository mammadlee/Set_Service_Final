          path: apps/qr_kiosk/dist
          if-no-files-found: error
          retention-days: 14

  container-security:
    name: Container build, SBOM and scan
    runs-on: ubuntu-latest
    needs: [release-inputs, backend]
    env:
      NODE_BASE_IMAGE: ${{ needs.release-inputs.outputs.node-base-image }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Require immutable official Node base image
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${NODE_BASE_IMAGE:-}" ]]; then
            echo "::error::Repository variable NODE_BASE_IMAGE is required."
            exit 1
          fi
          if [[ ! "$NODE_BASE_IMAGE" =~ ^node:20\.19\.4-bookworm-slim@sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::NODE_BASE_IMAGE must be node:20.19.4-bookworm-slim pinned to a full sha256 digest."
            exit 1
          fi

      - name: Build production release targets
        run: |
          docker build --build-arg NODE_BASE_IMAGE="$NODE_BASE_IMAGE" --target api --tag setservice-api:${{ github.sha }} .
          docker build --build-arg NODE_BASE_IMAGE="$NODE_BASE_IMAGE" --target outbox-worker --tag setservice-outbox:${{ github.sha }} .
          docker build --build-arg NODE_BASE_IMAGE="$NODE_BASE_IMAGE" --target migration --tag setservice-migration:${{ github.sha }} .

      - name: Verify non-root runtime metadata
        run: |
          for image in \
            setservice-api:${{ github.sha }} \
            setservice-outbox:${{ github.sha }} \
            setservice-migration:${{ github.sha }}
          do
            test "$(docker image inspect --format '{{.Config.User}}' "$image")" = "node"
            docker image inspect --format '{{json .Config.Entrypoint}}' "$image" | grep -q "dumb-init"
          done
          docker image inspect --format '{{json .Config.Healthcheck.Test}}' \
            setservice-api:${{ github.sha }} | grep -q "/health"
          docker image inspect --format '{{json .Config.Healthcheck.Test}}' \
            setservice-outbox:${{ github.sha }} | grep -q "/health"
          docker run --rm --entrypoint node setservice-migration:${{ github.sha }} -e "
            require.resolve('prisma');
            for (const dependency of ['typescript', 'ts-node', 'nodemon']) {
              try {
                require.resolve(dependency);
                throw new Error(dependency + ' must not be present in the migration image');
              } catch (error) {
                if (error && error.code !== 'MODULE_NOT_FOUND') throw error;
              }
            }
          "

      - name: Generate API SPDX SBOM
        uses: anchore/sbom-action@da167eac915b4e86f08b264dbdbc867b61be6f0c # v0.20.6
        with:
          image: setservice-api:${{ github.sha }}
          format: spdx-json
          output-file: setservice-api.spdx.json
          upload-artifact: false

      - name: Generate outbox SPDX SBOM
        uses: anchore/sbom-action@da167eac915b4e86f08b264dbdbc867b61be6f0c # v0.20.6
        with:
          image: setservice-outbox:${{ github.sha }}
          format: spdx-json
          output-file: setservice-outbox.spdx.json
          upload-artifact: false

      - name: Generate migration SPDX SBOM
        uses: anchore/sbom-action@da167eac915b4e86f08b264dbdbc867b61be6f0c # v0.20.6
        with:
          image: setservice-migration:${{ github.sha }}
          format: spdx-json
          output-file: setservice-migration.spdx.json
          upload-artifact: false

      - name: Scan API image
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0 # v0.28.0
        with:
          image-ref: setservice-api:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: "1"

      - name: Scan outbox image
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0 # v0.28.0
        with:
          image-ref: setservice-outbox:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: "1"

      - name: Scan migration image
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0 # v0.28.0
        with:
          image-ref: setservice-migration:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: "1"

      - name: Upload SBOMs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: setservice-release-sboms-${{ github.sha }}
          path: |
            setservice-api.spdx.json
            setservice-outbox.spdx.json
            setservice-migration.spdx.json
          if-no-files-found: error
          retention-days: 30

  worker-app:
    name: Worker Flutter App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js for release configuration validation
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20.19.4

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.32.6
          cache: true

      - name: Clean
        working-directory: apps/worker_app
        run: flutter clean

      - name: Install dependencies
        working-directory: apps/worker_app
        run: flutter pub get

      - name: Analyze
        working-directory: apps/worker_app
        run: flutter analyze

      - name: Test
        working-directory: apps/worker_app
        run: flutter test

      - name: Build Flutter web release
        working-directory: apps/worker_app
        run: >-
          flutter build web --release
          --dart-define=APP_ENV=staging
          --dart-define=BASE_URL=https://api.ci.setservice.az

      - name: Build debug APK
        working-directory: apps/worker_app
        run: flutter build apk --debug

      - name: Verify Android release signing fails closed without credentials
        working-directory: apps/worker_app
        shell: bash
        run: |
          set -euo pipefail
          if env \
            -u ANDROID_KEYSTORE_PATH \
            -u ANDROID_KEYSTORE_PASSWORD \
            -u ANDROID_KEY_ALIAS \
            -u ANDROID_KEY_PASSWORD \
            flutter build appbundle --release \
              --dart-define=APP_ENV=staging \
              --dart-define=BASE_URL=https://api.ci.setservice.az \
              > release-signing-check.log 2>&1
          then
            echo "Unsigned release build unexpectedly succeeded."
            exit 1
          fi
          grep -q "Release signing is not configured" release-signing-check.log

      - name: Build required signed staging Android AAB
        if: github.event_name != 'pull_request'
        working-directory: apps/worker_app
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
          STAGING_API_BASE_URL: ${{ secrets.STAGING_API_BASE_URL }}
        run: |
          set -euo pipefail
          REQUIRED_RELEASE_VALUES=(
            ANDROID_KEYSTORE_BASE64
            ANDROID_KEYSTORE_PASSWORD
            ANDROID_KEY_ALIAS
            ANDROID_KEY_PASSWORD
            ANDROID_GOOGLE_SERVICES_JSON_BASE64
            STAGING_API_BASE_URL
          )
          MISSING_RELEASE_VALUES=()
          for name in "${REQUIRED_RELEASE_VALUES[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              MISSING_RELEASE_VALUES+=("$name")
            fi
          done
          if (( ${#MISSING_RELEASE_VALUES[@]} > 0 )); then
            printf '::error::Missing required Android release configuration: %s\n' \
              "$(IFS=,; echo "${MISSING_RELEASE_VALUES[*]}")"
            exit 1
          fi

          node ../../scripts/validate-web-env.mjs worker

          KEYSTORE_PATH="$RUNNER_TEMP/setservice-release.jks"
          GOOGLE_SERVICES_PATH="$PWD/android/app/google-services.json"
          cleanup_release_files() {
            rm -f -- "$KEYSTORE_PATH" "$GOOGLE_SERVICES_PATH"
          }
          trap cleanup_release_files EXIT
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          printf '%s' "$ANDROID_GOOGLE_SERVICES_JSON_BASE64" \
            | base64 --decode > "$GOOGLE_SERVICES_PATH"
          test -s "$KEYSTORE_PATH"
          test -s "$GOOGLE_SERVICES_PATH"
          keytool -list \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            >/dev/null
          node - "$GOOGLE_SERVICES_PATH" <<'NODE'
          const { readFileSync } = require('node:fs');
          const configPath = process.argv[2];
          const config = JSON.parse(readFileSync(configPath, 'utf8'));
          const projectId = config?.project_info?.project_id;
          const packages = Array.isArray(config?.client)
            ? config.client.map(
                (client) => client?.client_info?.android_client_info?.package_name,
              )
            : [];
          if (typeof projectId !== 'string' || projectId.trim().length === 0) {
            throw new Error('google-services.json is missing project_info.project_id.');
          }
          if (!packages.includes('az.setservice.worker_app')) {
            throw new Error(
              'google-services.json does not contain az.setservice.worker_app.',
            );
          }
          NODE
          export ANDROID_KEYSTORE_PATH="$KEYSTORE_PATH"
          flutter build appbundle --release \
            --dart-define=APP_ENV=staging \
            --dart-define=BASE_URL="$STAGING_API_BASE_URL"

      - name: Upload signed staging AAB
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: setservice-worker-staging-aab-${{ github.sha }}
          path: apps/worker_app/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

  worker-ios:
    name: Worker iOS unsigned release gate
    runs-on: macos-14
    timeout-minutes: 30
    env:
      STAGING_API_BASE_URL: ${{ github.event_name == 'pull_request' && 'https://api.ci.setservice.az' || secrets.STAGING_API_BASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js for release configuration validation
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20.19.4

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.32.6
          cache: true

      - name: Clean
        working-directory: apps/worker_app
        run: flutter clean

      - name: Install dependencies
        working-directory: apps/worker_app
        run: flutter pub get

      - name: Validate iOS release API configuration
        working-directory: apps/worker_app
        run: node ../../scripts/validate-web-env.mjs worker

      - name: Build unsigned iOS release
        working-directory: apps/worker_app
        run: >-
          flutter build ios --release --no-codesign
          --dart-define=APP_ENV=staging
          --dart-define=BASE_URL="$STAGING_API_BASE_URL"
