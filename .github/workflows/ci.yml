      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20.19.4
          cache: npm
          cache-dependency-path: apps/company_dashboard/package-lock.json

      - name: Install dependencies
        working-directory: apps/company_dashboard
        run: npm ci

      - name: Production dependency audit
        working-directory: apps/company_dashboard
        run: npm audit --omit=dev --audit-level=high

      - name: Full dependency audit including build tooling
        working-directory: apps/company_dashboard
        run: npm audit --audit-level=high

      - name: Release environment regression
        working-directory: apps/company_dashboard
        run: npm run test:release-config

      - name: Web security regression
