name: SET Service CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  release-inputs:
    name: Immutable release inputs
    runs-on: ubuntu-latest
    env:
      NODE_BASE_IMAGE: ${{ vars.NODE_BASE_IMAGE }}
      POSTGRES_CI_IMAGE: ${{ vars.POSTGRES_CI_IMAGE }}
      REDIS_CI_IMAGE: ${{ vars.REDIS_CI_IMAGE }}
    outputs:
      node-base-image: ${{ steps.images.outputs.node-base-image }}
      postgres-ci-image: ${{ steps.images.outputs.postgres-ci-image }}
      redis-ci-image: ${{ steps.images.outputs.redis-ci-image }}
    steps:
      - name: Require immutable official CI images
        id: images
        shell: bash
        run: |
          set -euo pipefail
          required=(NODE_BASE_IMAGE POSTGRES_CI_IMAGE REDIS_CI_IMAGE)
          missing=()
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf '::error::Missing required immutable image variables: %s\n' \
              "$(IFS=,; echo "${missing[*]}")"
            exit 1
          fi

          if [[ ! "$NODE_BASE_IMAGE" =~ ^node:20\.19\.4-bookworm-slim@sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::NODE_BASE_IMAGE must be the official Node 20.19.4 bookworm-slim image pinned to a full sha256 digest."
            exit 1
          fi
          if [[ ! "$POSTGRES_CI_IMAGE" =~ ^postgres:16(\.[0-9]+){1,2}-bookworm@sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::POSTGRES_CI_IMAGE must be an official fully-versioned Postgres 16 bookworm image pinned to a full sha256 digest."
            exit 1
          fi
          if [[ ! "$REDIS_CI_IMAGE" =~ ^redis:7(\.[0-9]+){2}-alpine([0-9]+\.[0-9]+)?@sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::REDIS_CI_IMAGE must be an official fully-versioned Redis 7 alpine image pinned to a full sha256 digest."
            exit 1
          fi

          {
            echo "node-base-image=$NODE_BASE_IMAGE"
            echo "postgres-ci-image=$POSTGRES_CI_IMAGE"
            echo "redis-ci-image=$REDIS_CI_IMAGE"
          } >> "$GITHUB_OUTPUT"

  backend:
    name: Backend API
    runs-on: ubuntu-latest
    needs: release-inputs
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:ci-postgres-password@localhost:5432/setservice_test?schema=public
      DIRECT_URL: postgresql://postgres:ci-postgres-password@localhost:5432/setservice_test?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: "ci-Ax7mQ2vL9pR4tW8yK3nD6sF1hJ5cB0uZ"
      JWT_REFRESH_SECRET: "ci-H6qN1zV8cM3rT7wP2kD9sL4yF0bJ5xGa"
      JWT_ISSUER: set-service-ci
      JWT_AUDIENCE: set-service-ci-clients
      QR_HMAC_SECRET: "ci-Q4wB9mK2xT7pD1vL8sN5cR0yH6jF3zUa"
      KIOSK_TOKEN_ENCRYPTION_SECRET: "ci-K8tR3vN7qL2xF9mD4wH1sB6yP0cJ5zGa"
      OTP_PEPPER: "ci-P5yD0mV8kR3tN7xQ1wL6cH9sF2jB4zUa"
      OTP_TEST_MODE: "true"
      OTP_TEST_CODE: "123456"
      OTP_LOG_CODES: "false"
      SMS_PROVIDER: console
      STORAGE_PROVIDER: local
      PUSH_NOTIFICATIONS_ENABLED: "false"
      CORS_ORIGINS: http://localhost:5173,http://localhost:5174
      OUTBOX_WORKER_ENABLED: "false"
      OUTBOX_HEALTH_PORT: "3001"
    services:
      postgres:
        image: ${{ needs.release-inputs.outputs.postgres-ci-image }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-postgres-password
          POSTGRES_DB: setservice_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d setservice_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: ${{ needs.release-inputs.outputs.redis-ci-image }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20.19.4
          cache: npm

      - name: Secret scan
        run: npm run secrets:check

      - name: Install dependencies
        run: npm ci

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Migration toolchain and full dependency audit
        run: npm audit --audit-level=high

      - name: Prisma validate
        run: npx prisma validate

      - name: Typecheck
        run: npm run typecheck

      - name: Auth token and OTP security regression
        run: npm run test:auth-security

      - name: Worker document and PATCH security regression
        run: npm run test:worker-security

      - name: Backend and release security regression suite
        run: |
          npm run test:backend-access
          npm run test:company-report-isolation
          npm run test:report-aggregation
          npm run test:backend-infrastructure
          npm run test:text-id-locks
          npm run test:jwt-ttl
          npm run test:audit-transactions
          npm run test:approval-document-security
          npm run test:privacy-deletion
          npm run test:provider-delivery
          npm run test:document-backfill
          npm run test:seed-security
          npm run test:release-runbooks
          npm run test:dependency-policy
          npm run test:release-security
          npm run swagger:security

      - name: Production env validation
        env:
          NODE_ENV: production
          DATABASE_URL: postgresql://postgres:ci-postgres-password@localhost:5432/setservice_test?schema=public
          DIRECT_URL: postgresql://postgres:ci-postgres-password@localhost:5432/setservice_test?schema=public
          REDIS_URL: redis://localhost:6379
          JWT_ACCESS_SECRET: "ci-Ax7mQ2vL9pR4tW8yK3nD6sF1hJ5cB0uZ"
          JWT_REFRESH_SECRET: "ci-H6qN1zV8cM3rT7wP2kD9sL4yF0bJ5xGa"
          JWT_ISSUER: set-service-ci
          JWT_AUDIENCE: set-service-ci-clients
          QR_HMAC_SECRET: "ci-Q4wB9mK2xT7pD1vL8sN5cR0yH6jF3zUa"
          KIOSK_TOKEN_ENCRYPTION_SECRET: "ci-K8tR3vN7qL2xF9mD4wH1sB6yP0cJ5zGa"
          OTP_PEPPER: "ci-P5yD0mV8kR3tN7xQ1wL6cH9sF2jB4zUa"
          PROVIDER_OUTBOX_ENCRYPTION_SECRET: "ci-O7mC2xK9vR4tL8qD1wN6sH3yF0bJ5zUa"
          OUTBOX_WORKER_ENABLED: "false"
          OUTBOX_HEARTBEAT_TTL_SECONDS: "30"
          OUTBOX_MAX_CONSECUTIVE_FAILURES: "5"
          SWAGGER_DOCS_ENABLED: "false"
          CORS_ORIGINS: https://admin.example.com,https://company.example.com
          SMS_PROVIDER: pg365
          PG365_API_URL: https://pg365.example.test
          PG365_PUBLIC_KEY: ci-Pg365Public-K7vN2mQ9xR4tL8wD1sF6
          PG365_PRIVATE_KEY: ci-Pg365Private-H3yB7zU0cJ5pM9kT2vQ8
          PG365_ORIGINATOR: SET
          PG365_TIMEOUT_MS: "8000"
          EMAIL_PROVIDER: generic_http
          EMAIL_API_URL: https://email.example.test/send
          EMAIL_API_KEY: ci-email-api-key-12345678901234567890
          EMAIL_FROM: no-reply@example.test
          OTP_TEST_MODE: "false"
          OTP_LOG_CODES: "false"
          STORAGE_PROVIDER: s3
          S3_BUCKET: setservice-ci-documents
          S3_REGION: eu-central-1
          S3_ACCESS_KEY_ID: ci-s3-access-key
          S3_SECRET_ACCESS_KEY: ci-s3-secret-access-key
          STORAGE_PUBLIC_BASE_URL: https://cdn.example.com
          STORAGE_SIGNED_URL_TTL_SECONDS: "300"
          MALWARE_SCANNER_PROVIDER: http
          MALWARE_SCAN_REQUIRED: "true"
          MALWARE_SCANNER_URL: https://scanner.example.test/scan
        run: npx ts-node -e "import { checkEnv } from './src/lib/check-env'; checkEnv();"

      - name: Build
        run: npm run build

      - name: Swagger parse check
        run: npm run swagger:check

      - name: Swagger runtime drift check
        run: npm run swagger:drift

      - name: Prepare smoke credentials
        run: |
          ADMIN_PASSWORD="$(node -e "console.log(require('node:crypto').randomBytes(18).toString('base64url') + 'Aa1!')")"
          RESTRICTED_PASSWORD="$(node -e "console.log(require('node:crypto').randomBytes(18).toString('base64url') + 'Aa1!')")"
          COMPANY_PASSWORD="$(node -e "console.log(require('node:crypto').randomBytes(18).toString('base64url') + 'Aa1!')")"
          WORKER_PASSWORD="$(node -e "console.log(require('node:crypto').randomBytes(18).toString('base64url') + 'Aa1!')")"
          {
            echo "SEED_ADMIN_EMAIL=admin@setservice.az"
            echo "SEED_ADMIN_PASSWORD=$ADMIN_PASSWORD"
            echo "SEED_OPS_ADMIN_EMAIL=ops@setservice.az"
            echo "SEED_REPORTS_ADMIN_EMAIL=reports@setservice.az"
            echo "SEED_RESTRICTED_ADMIN_PASSWORD=$RESTRICTED_PASSWORD"
            echo "SEED_COMPANY_EMAIL=company@setservice.az"
            echo "SEED_COMPANY_PASSWORD=$COMPANY_PASSWORD"
            echo "SEED_WORKER_PASSWORD=$WORKER_PASSWORD"
            echo "SMOKE_ADMIN_EMAIL=admin@setservice.az"
            echo "SMOKE_ADMIN_PASSWORD=$ADMIN_PASSWORD"
            echo "SMOKE_REPORTS_ADMIN_EMAIL=reports@setservice.az"
            echo "SMOKE_RESTRICTED_ADMIN_PASSWORD=$RESTRICTED_PASSWORD"
            echo "SMOKE_COMPANY_EMAIL=company@setservice.az"
            echo "SMOKE_COMPANY_PASSWORD=$COMPANY_PASSWORD"
            echo "SMOKE_WORKER_PASSWORD=$WORKER_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Apply migrations
        run: npm run db:migrate:deploy

      - name: Migration status
        run: npx prisma migrate status

      - name: Migration/schema drift gate
        run: npx prisma migrate diff --from-url "$DIRECT_URL" --to-schema-datamodel prisma/schema.prisma --exit-code

      - name: PostgreSQL text ID row-lock regression
        env:
          TEXT_ID_LOCK_TEST_CONFIRM: "1"
        run: npm run test:text-id-locks

      - name: Auth sessions and OTP concurrency regression
        env:
          AUTH_SECURITY_INTEGRATION_CONFIRM: "1"
        run: npm run test:auth-security

      - name: Seed smoke database
        run: npm run db:seed

      - name: Order idempotency and cancellation regression
        env:
          ORDER_HARDENING_TEST_CONFIRM: "1"
        run: npm run test:orders-hardening

      - name: Order, assignment and attendance lifecycle concurrency regression
        env:
          LIFECYCLE_CONCURRENCY_TEST_CONFIRM: "1"
        run: npm run test:lifecycle-concurrency

      - name: MVP smoke
        run: |
          set -euo pipefail
          node dist/outbox-worker.js > outbox.log 2>&1 &
          OUTBOX_PID=$!
          node dist/index.js > api.log 2>&1 &
          API_PID=$!
          trap 'kill "$API_PID" "$OUTBOX_PID" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://localhost:3001/health >/dev/null \
              && curl -fsS http://localhost:3000/ready >/dev/null; then
              npm run smoke:mvp
              exit 0
            fi
            sleep 1
          done
          cat api.log
          cat outbox.log
          exit 1

  admin-panel:
    name: Admin Panel
    runs-on: ubuntu-latest
    env:
      VITE_API_BASE_URL: ${{ github.event_name == 'pull_request' && 'https://api.ci.setservice.az' || vars.PRODUCTION_API_BASE_URL }}
      VITE_KIOSK_BASE_URL: ${{ github.event_name == 'pull_request' && 'https://kiosk.ci.setservice.az' || vars.PRODUCTION_KIOSK_BASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20.19.4
          cache: npm
          cache-dependency-path: apps/admin_panel/package-lock.json

      - name: Install dependencies
        working-directory: apps/admin_panel
        run: npm ci

      - name: Production dependency audit
        working-directory: apps/admin_panel
        run: npm audit --omit=dev --audit-level=high

      - name: Full dependency audit including build tooling
        working-directory: apps/admin_panel
        run: npm audit --audit-level=high

      - name: Release environment regression
        working-directory: apps/admin_panel
        run: npm run test:release-config

      - name: Web security regression
        working-directory: apps/admin_panel
        run: npm run test:security

      - name: Typecheck
        working-directory: apps/admin_panel
        run: npm run typecheck

      - name: Build
        working-directory: apps/admin_panel
        run: npm run build

      - name: Upload admin panel artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: admin-panel-${{ github.event_name == 'pull_request' && 'pr-check' || 'production' }}-${{ github.sha }}
          path: apps/admin_panel/dist
          if-no-files-found: error
          retention-days: 14

